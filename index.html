<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16324F">
<title>Theo dõi công việc – Phòng Kỹ thuật – An toàn</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== Bảng màu: lấy cảm hứng từ đèn tín hiệu đường sắt ===== */
:root{
  --ink:#16324F; --ink-2:#4A5D70; --ink-3:#7C8A97;
  --paper:#F2F4F1; --surface:#FFFFFF; --line:#D8DDD6; --line-2:#E8EBE6;
  --run:#3D6E9E; --run-bg:#E6EEF6;
  --wait:#B97F08; --wait-bg:#FBF1D9;
  --done:#1E7F4F; --done-bg:#E1F2E8;
  --late:#B8362A; --late-bg:#F8E3E0;
  --pause:#6B7480; --pause-bg:#ECEEF0;
  --focus:#E0A100;
  --r-sm:6px; --r:10px;
  --shadow:0 1px 2px rgba(22,50,79,.08),0 4px 16px rgba(22,50,79,.06);
  --font:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --ink:#E4EAF0; --ink-2:#B1BDC8; --ink-3:#8392A0;
    --paper:#0F1B26; --surface:#172633; --line:#2A3C4C; --line-2:#213241;
    --run:#7FA9D4; --run-bg:#1C3348; --wait:#E6B44A; --wait-bg:#3A2F16;
    --done:#5CC08C; --done-bg:#163526; --late:#EE7B6E; --late-bg:#3E1D1A;
    --pause:#9AA4AE; --pause-bg:#26323D; --shadow:0 1px 2px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);font-size:15px;line-height:1.5;color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.hidden{display:none!important}
h1,h2,h3{margin:0;line-height:1.25}
h1{font-size:22px;font-weight:700;letter-spacing:-.01em}
h2{font-size:17px;font-weight:600}
h3{font-size:15px;font-weight:600}
.muted{color:var(--ink-3)}
.small{font-size:13px}
a{color:var(--run)}

/* ===== Khung ứng dụng ===== */
#app{min-height:100%;display:flex}
.rail{display:none}
.main{flex:1;min-width:0;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
.topbar{position:sticky;top:0;z-index:20;background:var(--paper);display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line)}
.topbar h1{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.content{padding:16px;max-width:1080px;margin:0 auto}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{flex:1;border:0;background:none;padding:8px 2px 10px;font-size:12px;font-weight:500;color:var(--ink-3);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabbar button svg{width:22px;height:22px}
.tabbar button[aria-current="page"]{color:var(--ink)}
.tabbar button[aria-current="page"] svg{stroke-width:2.3}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:40px;height:40px;display:grid;place-items:center;position:relative;flex:none}
.iconbtn svg{width:20px;height:20px}
.dot-count{position:absolute;top:-4px;right:-4px;background:var(--late);color:#fff;font-size:11px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
@media (min-width:960px){
  .rail{display:flex;flex-direction:column;width:232px;flex:none;background:var(--ink);color:#fff;position:sticky;top:0;height:100vh;padding:20px 12px}
  @media (prefers-color-scheme:dark){.rail{background:#0B1520}}
  .rail .brand{padding:4px 4px 22px;display:flex;align-items:center;gap:9px}
  .brand-chip{flex:none;width:36px;height:36px;border-radius:9px;background:#fff;display:grid;place-items:center;padding:4px}
  .brand-chip img{width:100%;height:100%;object-fit:contain}
  .brand-txt{font-weight:700;font-size:13.5px;line-height:1.35;white-space:nowrap}
  .brand-txt small{display:block;font-weight:400;font-size:11px;opacity:.7;margin-top:2px;white-space:normal}
  .rail button{display:flex;align-items:center;gap:10px;border:0;background:none;color:rgba(255,255,255,.72);padding:10px 12px;border-radius:8px;text-align:left;font-weight:500}
  .rail button svg{width:20px;height:20px}
  .rail button:hover{background:rgba(255,255,255,.07);color:#fff}
  .rail button[aria-current="page"]{background:rgba(255,255,255,.12);color:#fff}
  .rail .grow{flex:1}
  .rail .who{font-size:13px;opacity:.8;padding:10px 12px;border-top:1px solid rgba(255,255,255,.12)}
  .tabbar{display:none}
  .main{padding-bottom:24px}
  .topbar{padding:16px 24px}
  .content{padding:20px 24px}
}

/* ===== Nút & ô nhập ===== */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:9px 14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn.good{background:var(--done);border-color:var(--done);color:#fff}
.btn.warn{color:var(--late);border-color:var(--late-bg)}
.btn.ghost{border-color:transparent;background:none}
.btn:disabled{opacity:.5;cursor:default}
.btn.sm{min-height:32px;padding:5px 10px;font-size:13px}
.btn.block{width:100%}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.field>span{font-size:13px;font-weight:600;color:var(--ink-2)}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:9px 11px;min-height:42px}
textarea.input{min-height:84px;resize:vertical}
.input:focus{border-color:var(--run);outline:none;box-shadow:0 0 0 3px var(--run-bg)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>.grow{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 12px;font-weight:500;font-size:14px;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip small{opacity:.7;font-weight:400}

/* ===== Trạng thái ===== */
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.tag::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-run{color:var(--run);background:var(--run-bg)}
.s-wait{color:var(--wait);background:var(--wait-bg)}
.s-done{color:var(--done);background:var(--done-bg)}
.s-late{color:var(--late);background:var(--late-bg)}
.s-pause{color:var(--pause);background:var(--pause-bg)}
.pri{font-size:12px;font-weight:600;color:var(--ink-3)}
.pri.p3{color:var(--late)}

/* ===== Danh sách việc ===== */
.section{margin:22px 0 10px;display:flex;align-items:baseline;gap:8px}
.section:first-child{margin-top:4px}
.section .n{color:var(--ink-3);font-weight:500}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:grid;grid-template-columns:4px 1fr auto;gap:0 12px;padding:12px 14px 12px 0;border:0;border-bottom:1px solid var(--line-2);background:none;width:100%;text-align:left;align-items:center}
.item:last-child{border-bottom:0}
.item:hover{background:var(--paper)}
.item .strip{align-self:stretch;border-radius:0 3px 3px 0;background:var(--run)}
.item.late .strip{background:var(--late)} .item.wait .strip{background:var(--wait)} .item.done .strip{background:var(--done)} .item.pause .strip{background:var(--pause)}
.item .t{font-weight:600;line-height:1.35}
.item .meta{font-size:13px;color:var(--ink-3);margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.item .pct{font-weight:700;font-size:16px;text-align:right;min-width:48px}
.item .pct small{display:block;font-size:11px;font-weight:500;color:var(--ink-3)}
.warn-text{color:var(--late);font-weight:600}
.soon-text{color:var(--wait);font-weight:600}
.empty{padding:28px 18px;text-align:center;color:var(--ink-3);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
.bar{height:6px;border-radius:3px;background:var(--line-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--run);border-radius:3px}

/* ===== Bảng tổng quan ===== */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.dash{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:760px){.dash{grid-template-columns:1.1fr 1fr}.dash .wide{grid-column:1/-1}}
.plan{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.plan .big{font-size:48px;font-weight:700;line-height:1;letter-spacing:-.02em}
.plan .facts{display:grid;grid-template-columns:repeat(2,auto);gap:4px 18px;font-size:14px}
.plan .facts b{font-weight:700}
.legend{display:grid;gap:6px;font-size:14px}
.legend div{display:flex;align-items:center;gap:8px}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.load{display:grid;gap:10px}
.load .who{display:grid;grid-template-columns:minmax(130px,1fr) 2fr 150px;gap:10px;align-items:center;font-size:14px}
.load .who .bar{height:10px}
.load .over i{background:var(--late)} .load .idle i{background:var(--done)}
.hot{display:grid;gap:0}
.nudge-row{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line-2);font-size:14px}
.nudge-row:last-child{border-bottom:0}
.nudge-row .grow{flex:1;min-width:0}

/* ===== Chi tiết việc (ngăn trượt) ===== */
.scrim{position:fixed;inset:0;background:rgba(10,20,30,.45);z-index:50}
.sheet{position:fixed;z-index:60;background:var(--paper);inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:env(safe-area-inset-bottom)}
@media (min-width:960px){.sheet{left:auto;width:min(620px,100vw);box-shadow:-8px 0 30px rgba(0,0,0,.18)}}
.sheet-head{position:sticky;top:0;z-index:2;background:var(--paper);display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid var(--line)}
.sheet-head .grow{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-body{padding:16px;display:grid;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card h3{margin-bottom:10px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:14px}
.kv dt{color:var(--ink-3)} .kv dd{margin:0}

/* Tuyến duyệt: hiển thị như một đoạn đường ray có các ga */
.route{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding-top:4px}
.route::before{content:"";position:absolute;left:10%;right:10%;top:13px;height:6px;
  background:repeating-linear-gradient(90deg,var(--line) 0 3px,transparent 3px 11px),linear-gradient(var(--line),var(--line)) 0 0/100% 2px no-repeat,linear-gradient(var(--line),var(--line)) 0 100%/100% 2px no-repeat}
.route .st{position:relative;text-align:center;font-size:11.5px;line-height:1.3;color:var(--ink-3);padding:0 2px}
.route .st i{display:block;width:16px;height:16px;border-radius:50%;margin:0 auto 6px;background:var(--surface);border:3px solid var(--line);position:relative;z-index:1}
.route .st.past{color:var(--ink-2)} .route .st.past i{background:var(--done);border-color:var(--done)}
.route .st.now{color:var(--ink);font-weight:700} .route .st.now i{background:var(--wait);border-color:var(--wait);box-shadow:0 0 0 4px var(--wait-bg)}
.route .st.now.fin i{background:var(--done);border-color:var(--done);box-shadow:0 0 0 4px var(--done-bg)}

.exe{display:grid;grid-template-columns:1fr 64px;gap:4px 12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line-2);font-size:14px}
.exe:last-child{border-bottom:0}
.exe .pct{text-align:right;font-weight:700}
.exe .sub{grid-column:1/-1;display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--ink-3)}
.overall{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.overall b{font-size:32px;line-height:1}
input[type=range]{width:100%;accent-color:var(--ink);height:32px}
.actions{display:flex;flex-wrap:wrap;gap:8px}

.tl{display:grid;gap:0}
.ev{display:grid;grid-template-columns:32px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line-2)}
.ev:last-child{border-bottom:0}
.av{width:32px;height:32px;border-radius:50%;background:var(--run-bg);color:var(--run);display:grid;place-items:center;font-size:12px;font-weight:700}
.ev.sys .av{background:var(--line-2);color:var(--ink-3)}
.ev .who{font-size:13px}
.ev .who b{font-weight:600}
.ev .body{white-space:pre-wrap;word-break:break-word;margin-top:2px}
.ev.sys .body{color:var(--ink-2);font-size:14px}
.atts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.atts a{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:var(--r-sm);padding:4px 8px;font-size:13px;text-decoration:none;color:var(--ink);background:var(--paper);max-width:100%}
.atts img{width:96px;height:96px;object-fit:cover;border-radius:var(--r-sm);border:1px solid var(--line);display:block}
.composer{position:sticky;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:grid;gap:8px}
.pending{display:flex;flex-wrap:wrap;gap:6px}
.pending span{font-size:12px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 8px}

/* ===== Hộp thoại ===== */
.modal{position:fixed;z-index:80;inset:0;display:grid;place-items:end center}
@media (min-width:640px){.modal{place-items:center}}
.modal .scrim{z-index:0}
.modal .box{position:relative;z-index:1;background:var(--paper);width:min(560px,100vw);max-height:92vh;overflow-y:auto;border-radius:14px 14px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
@media (min-width:640px){.modal .box{border-radius:14px}}
.modal .box h2{margin-bottom:14px}
.toast{position:fixed;z-index:100;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;font-weight:500;max-width:90vw;box-shadow:var(--shadow)}
@media (min-width:960px){.toast{bottom:28px}}
.toast.err{background:var(--late);color:#fff}

/* ===== Đăng nhập ===== */
.auth{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--ink)}
@media (prefers-color-scheme:dark){.auth{background:#0B1520}}
.auth .box{background:var(--paper);border-radius:14px;padding:26px 22px;width:min(400px,100%)}
.auth .mark{display:flex;gap:10px;align-items:center;margin-bottom:18px}
.auth .mark.mark-col{flex-direction:column;align-items:flex-start;gap:14px}
.brand-logo{width:min(230px,72vw);height:auto;display:block}
.auth h1{font-size:19px}
.auth p{margin:0 0 16px;color:var(--ink-2);font-size:14px}
.err-msg{color:var(--late);font-size:14px;margin:-4px 0 12px}

table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line-2);vertical-align:top}
.tbl th{font-size:12.5px;color:var(--ink-3);font-weight:600}
.scrollx{overflow-x:auto}
.pwbox{font-family:ui-monospace,Consolas,monospace;background:var(--wait-bg);padding:1px 6px;border-radius:4px;font-weight:700}
@media (prefers-reduced-motion:no-preference){.sheet{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}
</style>
</head>
<body>
<div id="root"></div>

<script>
/* =====================================================================
 * CẤU HÌNH — đổi đúng 1 dòng này thành địa chỉ Worker của anh
 * ===================================================================== */

const icon = (k) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[k]}</svg>`;

/* ---------------- gọi API ---------------- */
async function api(action, data = {}, opt = {}) {
  let r;
  try {
    r = await fetch(API_URL + '/api', { method: 'POST', headers: { 'content-type': 'application/json', ...(S.tok ? { Authorization: 'Bearer ' + S.tok } : {}) }, body: JSON.stringify({ action, ...data }) });
  } catch (e) { throw new Error('Không kết nối được máy chủ. Kiểm tra mạng rồi thử lại.'); }
  let j; try { j = await r.json(); } catch { throw new Error('Máy chủ trả lời không hợp lệ (mã ' + r.status + ')'); }
  if (!j.ok) {
    if (j.code === 'HET_PHIEN' && S.tok) { logout(); if (!opt.quiet) toast(j.msg, true); }
    if (j.code === 'DOI_MAT_KHAU') { renderChangePw(true); }
    const e = new Error(j.msg || 'Có lỗi xảy ra'); e.code = j.code; throw e;
  }
  return j;
}
function toast(msg, err) {
  const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.setAttribute('role', 'status'); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), err ? 4500 : 2600);
}
async function guard(fn, btn) {
  if (btn) btn.disabled = true;
  try { return await fn(); } catch (e) { if (e.code !== 'HET_PHIEN') toast(e.message, true); } finally { if (btn) btn.disabled = false; }
}
function logout() { S.tok = ''; S.me = null; localStorage.removeItem('qlcv_tok'); clearInterval(S.timer); renderLogin(); }

/* ---------------- dữ liệu ---------------- */
async function load(quiet) {
  const j = await api('data.boot', {}, { quiet });
  S.skew = j.now - Date.now();
  S.me = j.me; S.users = j.users; S.U = Object.fromEntries(j.users.map((u) => [u.id, u])); S.depts = j.depts;
  S.cfg = j.cfg; S.unread = j.unread; S.files = j.files; S.tg = j.tg;
  const byT = {};
  j.members.forEach((m) => (byT[m.task_id] = byT[m.task_id] || []).push(m));
  S.tasks = j.tasks.map((t) => enrich(t, byT[t.id] || []));
}
function enrich(t, ms) {
  const me = S.me.id, n = now();
  t.ms = ms; t.exes = ms.filter((m) => m.role === 'exe'); t.sups = ms.filter((m) => m.role === 'sup').map((m) => m.user_id);
  t.iExe = t.exes.find((m) => m.user_id === me); t.iSup = t.sups.includes(me); t.iChair = t.chair_id === me;
  t.working = t.status === 'da_giao' || t.status === 'dang_trien_khai';
  t.late = t.working && t.deadline < n;
  t.soon = t.working && !t.late && t.deadline - n < DAY;
  t.grp = t.status === 'hoan_thanh' ? 'done' : t.status === 'tam_dung' ? 'pause' : t.status.startsWith('trinh') ? 'wait' : t.late ? 'late' : 'run';
  const ds = dayStart(n);
  t.stale = t.working ? t.exes.filter((m) => !m.last_update || m.last_update < ds).map((m) => m.user_id) : [];
  const isTP = S.me.role === 'tp' && S.me.dept_id === t.dept_id;
  t.needMe = (t.status === 'trinh_ld_phong' && (isTP || (['tp', 'pp'].includes(S.me.role) && (t.iChair || t.iSup)))) || (t.status === 'trinh_ld_cty' && (S.me.role === 'bgd' || isTP));
  return t;
}
function startPolling() {
  clearInterval(S.timer);
  const tick = async () => {
    if (document.hidden || !S.me || S.me.role === 'admin') return;
    try { await load(true); if (!document.querySelector('.modal') && !S.detail) renderView(); else updateBadges(); } catch {}
  };
  S.timer = setInterval(tick, 60000 * (0.75 + Math.random() * 0.5));
  document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
}

const sortTasks = (arr) => arr.sort((a, b) => (b.grp === 'late') - (a.grp === 'late') || a.deadline - b.deadline || b.priority - a.priority);

}

/* ---------------- Việc của tôi ---------------- */
function viewMine() {
  const open = S.tasks.filter((t) => t.status !== 'hoan_thanh');
  const need = sortTasks(open.filter((t) => t.needMe));
  const exe = sortTasks(open.filter((t) => t.iExe && !t.needMe));
  const lead = sortTasks(open.filter((t) => (t.iChair || t.iSup) && !t.iExe && !t.needMe));
  const doneRecent = S.tasks.filter((t) => t.status === 'hoan_thanh' && (t.iExe || t.iChair || t.iSup) && t.completed_at > now() - 14 * DAY).sort((a, b) => b.completed_at - a.completed_at);
  const staleN = exe.filter((t) => t.stale.includes(S.me.id)).length;
  let h = '';
  if (staleN && isWorkday()) h += `<div class="panel" style="border-color:var(--wait);background:var(--wait-bg);margin-bottom:6px"><b>Còn ${staleN} việc chưa cập nhật tiến độ hôm nay.</b> <span class="small">Mở từng việc để kéo thanh tiến độ hoặc ghi chú tình hình.</span></div>`;
  if (need.length) h += listBlock('Chờ tôi duyệt', need, { people: true }, '');
  h += listBlock('Tôi thực hiện', exe, { mine: true }, 'Chưa có việc nào được giao cho anh/chị.');
  if (S.me.role !== 'nv' || lead.length) h += listBlock('Tôi chủ trì / giám sát', lead, { people: true }, 'Chưa chủ trì hoặc giám sát việc nào.');
  if (doneRecent.length) h += listBlock('Hoàn thành 2 tuần qua', doneRecent, { mine: true }, '');
  $('#view').innerHTML = h; bindOpen($('#view'));
}

/* ---------------- Giám sát ---------------- */
function scopeTasks() { return S.tasks; }
function viewWatch() {

    if (f.st === 'run' && t.grp !== 'run') return false;

    return true;
  });
  sortTasks(arr);
  const stale = [];
  S.tasks.forEach((t) => { if ((t.iChair || t.iSup || S.me.role === 'tp') && t.stale.length) t.stale.forEach((u) => stale.push({ t, u })); });

    ${f.range === 'custom' ? `<input class="input" type="date" id="ffrom" value="${f.from}" aria-label="Từ ngày"><input class="input" type="date" id="fto" value="${f.to}" aria-label="Đến ngày">` : ''}
  </div></div>`;
  if (stale.length && S.me.role !== 'bgd') {

  const upd = (k, el, ev = 'change') => el && el.addEventListener(ev, () => { S.f[k] = el.value; if (k === 'q') { clearTimeout(S.qt); S.qt = setTimeout(() => { viewWatch(); const i = $('#fq'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }, 250); } else viewWatch(); });
  upd('q', $('#fq'), 'input'); upd('st', $('#fst')); upd('exe', $('#fexe')); upd('lead', $('#flead')); upd('range', $('#frange')); upd('from', $('#ffrom')); upd('to', $('#fto'));

/* ---------------- Tổng quan ---------------- */
function viewDash() {
  const [a, b] = rangeOf(S.period);

  // Kế hoạch kỳ: mọi việc đang mở trong kỳ (kể cả kéo dài từ kỳ trước); việc đã hoàn thành chỉ tính trong kỳ nó hoàn thành
  const plan = pool.filter((t) => t.created_at <= b && (!t.completed_at || t.completed_at >= a));
  const doneIn = plan.filter((t) => t.completed_at && t.completed_at <= b);
  const pct = plan.length ? Math.round((doneIn.length / plan.length) * 100) : 0;
  const open = pool.filter((t) => t.status !== 'hoan_thanh');
  const cnt = { done: doneIn.length, run: open.filter((t) => t.grp === 'run').length, wait: open.filter((t) => t.grp === 'wait').length, late: open.filter((t) => t.grp === 'late').length, pause: open.filter((t) => t.grp === 'pause').length };
  const segs = [['Hoàn thành trong kỳ', cnt.done, 'var(--done)'], ['Đang thực hiện', cnt.run, 'var(--run)'], ['Chờ duyệt', cnt.wait, 'var(--wait)'], ['Quá hạn', cnt.late, 'var(--late)'], ['Tạm dừng', cnt.pause, 'var(--pause)']];
  const total = segs.reduce((s, x) => s + x[1], 0);
  // Khối lượng: điểm = tổng trọng số ưu tiên (Cao 3, TB 2, Thấp 1) của việc đang làm
  // Nhân viên luôn hiện; Trưởng/Phó phòng chỉ hiện khi đang trực tiếp thực hiện việc
  const doing = (u) => pool.some((t) => t.working && t.exes.some((m) => m.user_id === u.id));
  const people = S.users.filter((u) => u.active && (u.role === 'nv' || (['tp', 'pp'].includes(u.role) && doing(u))) && (S.me.role === 'bgd' ? (!S.dashDept || u.dept_id === +S.dashDept) : S.me.role === 'tp' ? u.dept_id === S.me.dept_id : pool.some((t) => t.exes.some((m) => m.user_id === u.id))));
  const load = people.map((u) => {
    const ts = pool.filter((t) => t.working && t.exes.some((m) => m.user_id === u.id));
    return { u, n: ts.length, score: ts.reduce((s, t) => s + t.priority, 0), late: ts.filter((t) => t.late).length };
  }).sort((x, y) => y.score - x.score);
  const maxScore = Math.max(S.cfg.overload || 8, ...load.map((x) => x.score));
  const hot = sortTasks(pool.filter((t) => t.late || t.soon));
  const periods = [['week', 'Tuần này'], ['lastweek', 'Tuần trước'], ['month', 'Tháng này'], ['lastmonth', 'Tháng trước']];
  let h = `<div class="row" style="margin-bottom:14px"><div class="seg" role="group" aria-label="Kỳ báo cáo">${periods.map(([k, l]) => `<button data-per="${k}" aria-pressed="${S.period === k}">${l}</button>`).join('')}</div>
    ${S.me.role === 'bgd' ? `<select class="input" id="ddept" style="width:auto"><option value="">Toàn công ty</option>${S.depts.map((d) => `<option value="${d.id}" ${+S.dashDept === d.id ? 'selected' : ''}>${esc(d.name)}</option>`).join('')}</select>` : ''}
    <span class="muted small">${fmtShort(a).slice(6)} – ${fmtShort(b).slice(6)}</span></div>
  <div class="dash">
    <section class="panel"><h2 style="margin-bottom:12px">Hoàn thành kế hoạch</h2><div class="plan"><div class="big">${pct}%</div>
      <div class="facts"><span>Việc trong kỳ</span><b>${plan.length}</b><span>Đã hoàn thành</span><b>${doneIn.length}</b><span>Còn mở</span><b>${plan.length - doneIn.length}</b><span>Đang quá hạn</span><b style="color:var(--late)">${cnt.late}</b></div></div>

    <section class="panel"><h2 style="margin-bottom:12px">Tình trạng công việc</h2><div class="row" style="gap:18px;align-items:center">${donut(segs, total)}
      <div class="legend">${segs.map(([l, v, c]) => `<div><i style="background:${c}"></i>${l}<b style="margin-left:auto;padding-left:12px">${v}</b></div>`).join('')}</div></div></section>
    <section class="panel wide"><div class="row" style="margin-bottom:12px"><h2 class="grow">Khối lượng đang nắm giữ</h2><span class="small muted">Điểm = tổng mức ưu tiên (Cao 3 · TB 2 · Thấp 1). Quá tải từ ${S.cfg.overload}, rảnh khi ≤ ${S.cfg.idle}.</span></div>
      <div class="load">${load.length ? load.map((x) => { const cls = x.score >= S.cfg.overload ? 'over' : x.score <= S.cfg.idle ? 'idle' : ''; return `<div class="who ${cls}"><span><b>${esc(x.u.full_name)}</b><div class="small muted">${esc(x.u.title || ROLE[x.u.role])}</div></span><div class="bar"><i style="width:${Math.max(3, (x.score / maxScore) * 100)}%"></i></div><span class="small" style="text-align:right;min-width:92px">${x.n} việc · ${x.score} điểm<br><b style="color:${cls === 'over' ? 'var(--late)' : cls === 'idle' ? 'var(--done)' : 'var(--ink-2)'}">${cls === 'over' ? 'Quá tải' : cls === 'idle' ? 'Rảnh' : 'Vừa sức'}</b>${x.late ? ` · <span class="warn-text">${x.late} quá hạn</span>` : ''}</span></div>`; }).join('') : '<div class="muted">Chưa có dữ liệu.</div>'}</div></section>
  </div>`;
  h += listBlock('Điểm nóng: quá hạn hoặc đến hạn trong 24 giờ', hot, { people: true }, 'Không có việc nào quá hạn hoặc sắp đến hạn.');
  $('#view').innerHTML = h; bindOpen($('#view'));
  document.querySelectorAll('[data-per]').forEach((b) => (b.onclick = () => { S.period = b.dataset.per; viewDash(); }));
  if ($('#ddept')) $('#ddept').onchange = (e) => { S.dashDept = e.target.value; viewDash(); };
}
function donut(segs, total) {

  const arcs = total ? segs.filter((s) => s[1]).map(([l, v, c]) => { const len = (v / total) * C; const el = `<circle r="${R}" cx="70" cy="70" fill="none" stroke="${c}" stroke-width="22" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-off}"><title>${l}: ${v}</title></circle>`; off += len; return el; }).join('') : `<circle r="${R}" cx="70" cy="70" fill="none" stroke="var(--line)" stroke-width="22"/>`;

}

  toast(ST[r.status] ? 'Đã chuyển: ' + ST[r.status][0] : 'Đã cập nhật'); await reloadDetail();

function evHtml(a, files) {
  const who = esc(nameOf(a.user_id)), m = a.meta || {};
  const t = `<span class="muted"> · ${fmtShort(a.created_at)}</span>`;
  const fl = files && files.length ? `<div class="atts">${files.map((f) => /^image\//.test(f.mime) ? `<a href="${esc(f.url)}" target="_blank" rel="noopener"><img src="${esc(f.url)}" alt="${esc(f.name)}" loading="lazy"></a>` : `<a href="${esc(f.url)}" target="_blank" rel="noopener">${icon('clip').replace('<svg', '<svg width="14" height="14"')} ${esc(f.name)} <span class="muted">${(f.size / 1024 / 1024).toFixed(1)} MB</span></a>`).join('')}</div>` : '';
  const men = m.mentions && m.mentions.length ? `<div class="small" style="color:var(--run)">Nhắc: ${m.mentions.map((u) => esc(nameOf(u))).join(', ')}</div>` : '';
  if (a.kind === 'comment') return `<div class="ev"><span class="av">${esc(initials(nameOf(a.user_id)))}</span><div><div class="who"><b>${who}</b>${t}</div>${men}${a.body ? `<div class="body">${esc(a.body)}</div>` : ''}${fl}</div></div>`;
  let s = '';
  switch (a.kind) {
    case 'create': s = 'giao công việc'; break;
    case 'progress': s = `cập nhật tiến độ ${m.from}% → <b>${m.to}%</b>`; break;
    case 'overall': s = m.auto ? 'chuyển % chung về trung bình người thực hiện' : `chốt % chung ${m.from}% → <b>${m.to}%</b>`; break;
    case 'deadline': s = `đổi thời hạn ${fmtShort(m.from)} → <b>${fmtShort(m.to)}</b>`; break;
    case 'nudge': s = `nhắc ${m.mentions ? esc(nameOf(m.mentions[0])) : ''} cập nhật tiến độ`; break;
    case 'status': s = m.op === 'cancel' ? 'hủy công việc' : m.op === 'reject' ? '<b>trả lại</b> để hoàn thiện' : m.op === 'pause' ? 'tạm dừng' : m.op === 'resume' ? 'cho tiếp tục' : m.op === 'submit' ? '<b>trình Lãnh đạo phòng</b>' : `duyệt → <b>${esc(ST[m.to] ? ST[m.to][0] : m.to)}</b>`; break;
    case 'edit': s = 'sửa thông tin' + [m.title ? ' tên việc' : '', m.priority ? ` ưu tiên (${PRI[m.priority]})` : '', m.executors ? ' người thực hiện' : '', m.supervisors ? ' người giám sát' : '', m.chair_id ? ' người chủ trì' : '', m.description ? ' mô tả' : '', m.needs_company !== undefined ? ' yêu cầu trình LĐ công ty' : ''].filter(Boolean).join(','); break;
    default: s = esc(a.kind);
  }
  return `<div class="ev sys"><span class="av">${esc(initials(nameOf(a.user_id)))}</span><div><div class="body"><b>${who}</b> ${s}${t}</div>${a.body ? `<div class="body" style="color:var(--ink)">“${esc(a.body)}”</div>` : ''}${fl}</div></div>`;
}
async function addFiles(input) {
  const files = [...input.files]; input.value = '';
  for (const f of files) {
    if (f.size > 15 * 1024 * 1024 && !/^image\//.test(f.type)) { toast(`${f.name} vượt quá 15 MB`, true); continue; }
    S.pendingFiles.push(/^image\//.test(f.type) && f.type !== 'image/gif' ? await shrink(f) : f);
  }
  $('#pend').innerHTML = S.pendingFiles.map((f) => `<span>${esc(f.name)}</span>`).join('');
}
function shrink(file) {
  return new Promise((res) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const max = 1600, k = Math.min(1, max / Math.max(img.width, img.height));
      if (k === 1 && file.size < 600 * 1024) { URL.revokeObjectURL(url); return res(file); }
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob((b) => res(b ? new File([b], file.name.replace(/\.\w+$/, '') + '.jpg', { type: 'image/jpeg' }) : file), 'image/jpeg', 0.82);
    };
    img.onerror = () => { URL.revokeObjectURL(url); res(file); };
    img.src = url;
  });
}
async function upload(taskId, f) {
  const r = await fetch(`${API_URL}/upload?task=${taskId}`, { method: 'POST', headers: { Authorization: 'Bearer ' + S.tok, 'content-type': f.type || 'application/octet-stream', 'X-File-Name': encodeURIComponent(f.name) }, body: f });
  const j = await r.json().catch(() => ({ ok: false, msg: 'Tải tệp thất bại' }));
  if (!j.ok) throw new Error(j.msg || 'Tải tệp thất bại');
  return j;
}

function openForm(detail, parent) {
  const editing = !!detail, t = editing ? detail.task : null;

  const deptUsers = S.users.filter((u) => u.active && u.dept_id === dept);
  const leaders = deptUsers.filter((u) => ['tp', 'pp'].includes(u.role));
  const doers = deptUsers.filter((u) => ['tp', 'pp', 'nv'].includes(u.role));
  const isSub = !!(parent || (t && t.parent_id));
  const canChair = !isSub && S.me.role === 'tp';
  const cur = editing ? { exe: detail.members.filter((m) => m.role === 'exe').map((m) => m.user_id), sup: detail.members.filter((m) => m.role === 'sup').map((m) => m.user_id), chair: t.chair_id }
    : { exe: [], sup: [], chair: S.me.id };

  const chipList = (arr, sel, name) => arr.map((u) => `<button type="button" class="chip" data-${name}="${u.id}" aria-pressed="${sel.includes(u.id)}">${esc(u.full_name)} <small>${u.role === 'nv' ? '' : ROLE[u.role]}</small></button>`).join('');

    ${parent ? `<p class="small muted" style="margin-top:-6px">Thuộc việc: <b>${esc(parent.title)}</b>. Anh/chị là người chủ trì việc con này.</p>` : ''}
    <label class="field"><span>Tên công việc</span><input class="input" name="ttl" required maxlength="200" value="${esc(t ? t.title : '')}"></label>
    <label class="field"><span>Mô tả chi tiết</span><textarea class="input" name="desc" maxlength="5000">${esc(t ? t.description || '' : '')}</textarea></label>
    ${canChair ? `<label class="field"><span>Người chủ trì</span><select class="input" name="chair">${leaders.map((u) => `<option value="${u.id}" ${cur.chair === u.id ? 'selected' : ''}>${esc(u.full_name)} (${ROLE[u.role]})</option>`).join('')}</select></label>` : ''}
    ${!isSub ? `<div class="field"><span>Người phụ trách / giám sát</span><div class="chips">${chipList(leaders.filter((u) => u.id !== cur.chair), cur.sup, 'sup')}</div></div>` : ''}
    <div class="field"><span>Người thực hiện (chọn một hoặc nhiều)</span><div class="chips">${chipList(doers, cur.exe, 'exe')}</div></div>
    <div class="grid2"><label class="field"><span>Hạn hoàn thành – ngày</span><input class="input" type="date" name="d" required value="${toDateStr(dl)}"></label>
      <label class="field"><span>Giờ</span><input class="input" type="time" name="h" required value="${toTimeStr(dl)}"></label></div>
    <div class="field" id="reasonf" style="display:none"><span>Lý do đổi hạn</span><input class="input" name="reason" maxlength="500" placeholder="Ghi rõ để mọi người cùng nắm"></div>
    <div class="field"><span>Mức độ ưu tiên</span><div class="seg" role="group">${[3, 2, 1].map((p) => `<button type="button" data-pri="${p}" aria-pressed="${(t ? t.priority : 2) === p}">${PRI[p]}</button>`).join('')}</div></div>
    <label class="row" style="margin-bottom:16px"><input type="checkbox" name="nc" ${!t || t.needs_company ? 'checked' : ''} style="width:20px;height:20px"> <span>Cần trình Lãnh đạo công ty duyệt sau khi Lãnh đạo phòng duyệt</span></label>
    <div id="tferr" class="err-msg hidden"></div>
    <div class="row"><button type="button" class="btn ghost" data-close>Hủy bỏ</button><span class="grow"></span><button class="btn primary" id="tfsave">${editing ? 'Lưu thay đổi' : 'Giao việc'}</button></div></form>`, (box) => {
    const f = $('#tf', box);
    let pri = t ? t.priority : 2;
    box.querySelectorAll('[data-pri]').forEach((b) => (b.onclick = () => { pri = +b.dataset.pri; box.querySelectorAll('[data-pri]').forEach((x) => x.setAttribute('aria-pressed', x === b)); }));
    box.querySelectorAll('.chip').forEach((b) => (b.onclick = () => b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') !== 'true')));
    if (editing) { const chk = () => ($('#reasonf', box).style.display = fromVN(f.d.value, f.h.value) !== t.deadline ? '' : 'none'); f.d.onchange = chk; f.h.onchange = chk; }
    if (f.chair) f.chair.onchange = () => { const c = +f.chair.value; box.querySelectorAll('[data-sup]').forEach((b) => { b.style.display = +b.dataset.sup === c ? 'none' : ''; if (+b.dataset.sup === c) b.setAttribute('aria-pressed', 'false'); }); };
    if (f.chair) f.chair.onchange();
    f.onsubmit = (e) => { e.preventDefault(); guard(async () => {
      const picked = (n) => [...box.querySelectorAll(`[data-${n}][aria-pressed="true"]`)].filter((b) => b.style.display !== 'none').map((b) => +b.dataset[n]);
      const payload = { title: f.ttl.value.trim(), description: f.desc.value, executors: picked('exe'), priority: pri, deadline: fromVN(f.d.value, f.h.value), needs_company: f.nc.checked };
      if (!isSub) payload.supervisors = picked('sup');
      if (f.chair) payload.chair_id = +f.chair.value;
      const er = $('#tferr', box);
      if (!payload.executors.length) { er.textContent = 'Chọn ít nhất một người thực hiện'; er.classList.remove('hidden'); return; }
      if (editing) {
        if (payload.deadline !== t.deadline) payload.reason = f.reason.value.trim();
        await api('task.update', { id: t.id, ...payload }); closeModal(); toast('Đã lưu thay đổi'); await reloadDetail();
      } else {
        if (parent) payload.parent_id = parent.id;
        const r = await api('task.create', payload); closeModal(); toast('Đã giao việc và gửi thông báo');
        await load(true); if (parent) { S.closeDetail(); openTask(r.id); } else renderView();
      }
    }, $('#tfsave', box)); };
  });
}

/* ---------------- Hộp thoại chung ---------------- */
function openModal(html, onReady) {
  closeModal();
  document.body.insertAdjacentHTML('beforeend', `<div class="modal" role="dialog" aria-modal="true"><div class="scrim" data-close></div><div class="box">${html}</div></div>`);
  const m = document.querySelector('.modal');
  m.querySelectorAll('[data-close]').forEach((b) => (b.onclick = closeModal));
  m.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
  const first = m.querySelector('input,select,textarea,button:not([data-close])'); first && first.focus();
  if (onReady) onReady(m.querySelector('.box'));
}
function closeModal() { document.querySelector('.modal')?.remove(); }

      <p class="small">${d.users.filter((u) => u.tg && u.active).length}/${d.users.filter((u) => u.active && u.role !== 'admin').length} người đã kết nối Telegram.</p>
      <div class="row"><button class="btn primary" id="tgset">Cài đặt webhook</button><button class="btn" id="tgtest">Gửi thử cho tôi</button></div>
      <h2 style="margin:18px 0 8px">Chạy thử nhắc việc</h2><div class="row"><button class="btn" data-cron="am">Gửi nhắc 8h00 ngay</button><button class="btn" data-cron="pm">Gửi nhắc 16h30 ngay</button></div>
      <p class="small muted">Dùng để kiểm tra; bình thường hệ thống tự gửi đúng giờ vào ngày làm việc.</p></div>`;
  } else {
    h += `<div class="panel" style="padding:0"><table class="tbl"><thead><tr><th>Thời gian</th><th>Người thực hiện</th><th>Thao tác</th></tr></thead><tbody>${d.log.map((l) => `<tr><td>${fmtShort(l.created_at)}</td><td>${esc(l.full_name || '')}</td><td>${esc(l.action)} <span class="small muted">${esc(l.detail || '')}</span></td></tr>`).join('') || '<tr><td colspan="3" class="muted">Chưa có.</td></tr>'}</tbody></table></div>`;
  }
  $('#view').innerHTML = h;
  document.querySelectorAll('[data-at]').forEach((b) => (b.onclick = () => { S.atab = b.dataset.at; viewAdmin(); }));
  const deptOpts = (sel) => d.depts.map((x) => `<option value="${x.id}" ${sel === x.id ? 'selected' : ''}>${esc(x.name)}</option>`).join('');
  const showPw = (rows) => openModal(`<h2>Mật khẩu tạm</h2><p class="small">Gửi riêng cho từng người. Lần đăng nhập đầu, hệ thống sẽ yêu cầu đổi mật khẩu. <b>Mật khẩu tạm chỉ hiện một lần.</b></p>
    <div class="scrollx"><table class="tbl"><thead><tr><th>Họ tên</th><th>Đăng nhập</th><th>Mật khẩu tạm</th></tr></thead><tbody>${rows.map((r) => `<tr><td>${esc(r.full_name || '')}</td><td>${esc(r.username)}</td><td><span class="pwbox">${esc(r.password)}</span></td></tr>`).join('')}</tbody></table></div>
    <div class="row" style="margin-top:14px"><button class="btn" id="cpy">Sao chép danh sách</button><span class="grow"></span><button class="btn primary" data-close>Đã lưu lại</button></div>`, (box) => {
    $('#cpy', box).onclick = () => { navigator.clipboard.writeText(rows.map((r) => `${r.full_name || ''}\t${r.username}\t${r.password}`).join('\n')).then(() => toast('Đã sao chép')); };
  });
  const userForm = (u) => openModal(`<form id="uf"><h2>${u ? 'Sửa tài khoản' : 'Thêm tài khoản'}</h2>
    <label class="field"><span>Họ và tên</span><input class="input" name="n" required value="${esc(u ? u.full_name : '')}"></label>
    ${u ? '' : '<label class="field"><span>Tên đăng nhập (để trống sẽ tự tạo)</span><input class="input" name="un" autocapitalize="none" placeholder="vd: dungha"></label>'}
    <label class="field"><span>Chức vụ</span><input class="input" name="t" value="${esc(u ? u.title || '' : '')}"></label>
    <label class="field"><span>Vai trò trong hệ thống</span><select class="input" name="r">${Object.entries(ROLE).map(([k, l]) => `<option value="${k}" ${u && u.role === k ? 'selected' : !u && k === 'nv' ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
    <label class="field"><span>Phòng ban</span><select class="input" name="d"><option value="">— Không thuộc phòng (Admin, Ban Giám đốc)</option>${deptOpts(u ? u.dept_id : d.depts[0] && d.depts[0].id)}</select></label>
    ${u ? `<label class="row" style="margin-bottom:14px"><input type="checkbox" name="a" ${u.active ? 'checked' : ''} style="width:20px;height:20px"> Đang hoạt động (bỏ chọn để khóa tài khoản)</label>` : ''}
    <div class="row"><button type="button" class="btn ghost" data-close>Hủy bỏ</button><span class="grow"></span><button class="btn primary" id="ufs">Lưu</button></div></form>`, (box) => {
    $('#uf', box).onsubmit = (e) => { e.preventDefault(); const f = e.target; guard(async () => {
      const r = await api('admin.userSave', { id: u && u.id, full_name: f.n.value, username: f.un && f.un.value, title: f.t.value, role: f.r.value, dept_id: +f.d.value || null, active: u ? f.a.checked : true });
      closeModal(); if (r.password) showPw([{ full_name: f.n.value, username: r.username, password: r.password }]); else toast('Đã lưu'); viewAdmin();
    }, $('#ufs', box)); };
  });
  if ($('#uadd')) $('#uadd').onclick = () => userForm(null);
  document.querySelectorAll('[data-ue]').forEach((b) => (b.onclick = () => userForm(d.users.find((u) => u.id === +b.dataset.ue))));
  document.querySelectorAll('[data-ur]').forEach((b) => (b.onclick = () => guard(async () => { const u = d.users.find((x) => x.id === +b.dataset.ur); if (!confirm(`Cấp lại mật khẩu cho ${u.full_name}? Mật khẩu cũ và các phiên đăng nhập sẽ hết hiệu lực.`)) return; const r = await api('admin.resetPw', { id: u.id }); showPw([{ full_name: u.full_name, ...r }]); viewAdmin(); }, b)));
  if ($('#ubulk')) $('#ubulk').onclick = () => openModal(`<form id="bf"><h2>Nhập danh sách nhân sự</h2>
    <p class="small muted" style="margin-top:-6px">Mỗi dòng một người: <b>Họ tên | Chức vụ</b>. Vai trò tự nhận theo chức vụ (Trưởng phòng, Phó phòng, còn lại là Nhân viên). Tên đăng nhập và mật khẩu tạm được tạo tự động.</p>
    <label class="field"><span>Phòng ban</span><select class="input" name="d" required>${deptOpts(d.depts[0] && d.depts[0].id)}</select></label>
    <label class="field"><span>Danh sách</span><textarea class="input" name="t" rows="8" placeholder="Hoàng Anh Dũng | Trưởng phòng&#10;Đinh Văn Hùng | Phó phòng&#10;Lương Xuân Anh | Kỹ thuật viên"></textarea></label>
    <div class="row"><button type="button" class="btn ghost" data-close>Hủy bỏ</button><span class="grow"></span><button class="btn primary" id="bfs">Tạo tài khoản</button></div></form>`, (box) => {
    $('#bf', box).onsubmit = (e) => { e.preventDefault(); const f = e.target; guard(async () => {
      if (!d.depts.length) throw new Error('Tạo phòng ban trước');
      const r = await api('admin.bulkImport', { dept_id: +f.d.value, text: f.t.value }); closeModal(); showPw(r.created); viewAdmin();
    }, $('#bfs', box)); };
  });
  const deptForm = (x) => openModal(`<form id="df"><h2>${x ? 'Sửa phòng ban' : 'Thêm phòng ban'}</h2>
    <label class="field"><span>Mã phòng (viết tắt, không dấu)</span><input class="input" name="c" required value="${esc(x ? x.code : '')}" placeholder="KTAT"></label>
    <label class="field"><span>Tên phòng ban</span><input class="input" name="n" required value="${esc(x ? x.name : '')}" placeholder="Phòng Kỹ thuật – An toàn"></label>
    <div class="row"><button type="button" class="btn ghost" data-close>Hủy bỏ</button><span class="grow"></span><button class="btn primary" id="dfs">Lưu</button></div></form>`, (box) => {
    $('#df', box).onsubmit = (e) => { e.preventDefault(); const f = e.target; guard(async () => { await api('admin.deptSave', { id: x && x.id, code: f.c.value, name: f.n.value }); closeModal(); toast('Đã lưu'); viewAdmin(); }, $('#dfs', box)); };
  });
  if ($('#dadd')) $('#dadd').onclick = () => deptForm(null);
  document.querySelectorAll('[data-de]').forEach((b) => (b.onclick = () => deptForm(d.depts.find((x) => x.id === +b.dataset.de))));
  if ($('#cfgf')) {
    let hol = [...(d.cfg.holidays || [])];
    const drawH = () => ($('#hl').innerHTML = hol.length ? hol.map((x) => `<button type="button" class="chip" data-hr="${x}" title="Bấm để xóa">${x.split('-').reverse().join('/')} ✕</button>`).join('') : '<span class="small muted">Chưa khai báo ngày nghỉ lễ.</span>', document.querySelectorAll('[data-hr]').forEach((b) => (b.onclick = () => { hol = hol.filter((x) => x !== b.dataset.hr); drawH(); })));
    drawH();
    $('#hadd').onclick = () => { const v = $('#hd').value; if (v && !hol.includes(v)) { hol.push(v); hol.sort(); drawH(); } };
    $('#cfgf').onsubmit = (e) => { e.preventDefault(); const f = e.target; guard(async () => { await api('admin.settingsSave', { overload: +f.o.value, idle: +f.i.value, holidays: hol }); toast('Đã lưu cài đặt'); }); };
  }
  if ($('#tgset')) $('#tgset').onclick = (e) => guard(async () => { const r = await api('admin.tgSetup'); toast(`Đã cài webhook cho @${r.bot}`); if (!r.matches) toast('Lưu ý: TG_BOT_USERNAME trên Worker khác tên bot thật (@' + r.bot + ')', true); }, e.target);
  if ($('#tgtest')) $('#tgtest').onclick = (e) => guard(async () => { const r = await api('admin.tgTest'); toast(r.ok ? 'Đã gửi, kiểm tra Telegram' : 'Gửi không thành công', !r.ok); }, e.target);
  document.querySelectorAll('[data-cron]').forEach((b) => (b.onclick = () => guard(async () => { await api('admin.runCron', { which: b.dataset.cron }); toast('Đã chạy'); }, b)));
}

/* ---------------- khởi động ---------------- */
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
window.addEventListener('hashchange', () => { const m = location.hash.match(/t=(\d+)/); if (m && S.me) { history.replaceState(null, '', location.pathname); S.closeDetail && S.detail && S.closeDetail(); openTask(+m[1]); } });
if (API_URL.includes('YOUR-SUBDOMAIN')) document.getElementById('root').innerHTML = '<div class="auth"><div class="box"><h1>Chưa cấu hình</h1><p>Mở index.html, sửa dòng <b>API_URL</b> thành địa chỉ Worker rồi tải lại trang.</p></div></div>';
else if (S.tok) boot(); else renderLogin();
</script>
</body>
</html>
