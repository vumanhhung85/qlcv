<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2F3541">
<title>Theo dõi công việc – Phòng Kỹ thuật – An toàn</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>try{var th=localStorage.getItem('qlcv_theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=th}catch(e){}</script>
<style>
/* ===== Bảng màu (đèn tín hiệu đường sắt) ===== */
:root{
  /* Bảng "Flat UI Colors" (Bootflat-Admin) — mỗi màu một vai trò cố định, dùng xuyên suốt app */
  --blue-jeans:#4A89DC; --aqua:#3BAFDA; --mint:#37BC9B; --grass:#8CC152; --sunflower:#F6BB42;
  --bittersweet:#E9573F; --grapefruit:#DA4453; --lavender:#967ADC; --pinkrose:#D770AD;
  --gray-l:#F5F7FA; --gray-l2:#E6E9ED; --gray-m:#AAB2BD; --gray-d:#656D78; --gray-d2:#434A54;

  --ink:var(--gray-d2); --ink-2:var(--gray-d); --ink-3:var(--gray-m);
  --paper:var(--gray-l); --surface:#FFFFFF; --line:var(--gray-l2); --line-2:#EFF2F5;
  --run:var(--blue-jeans); --run-bg:#E9F1FC; --wait:#C98A12; --wait-bg:#FDF3DE;
  --done:#2FA98A; --done-bg:#E3F7F1; --late:var(--grapefruit); --late-bg:#FBEAEC;
  --pause:#707886; --pause-bg:#EEF0F2; --focus:#D98C00;
  --pri-hi:var(--bittersweet); --pri-mid:var(--aqua); --pri-lo:var(--grass);
  --accent:var(--pinkrose); --accent-2:var(--lavender);
  --side:#2F3541; --side-2:#3B4250;
  --r-sm:6px; --r:10px; --shadow:0 1px 2px rgba(22,50,79,.06),0 6px 20px rgba(22,50,79,.07);
  --font:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --ink:#E6E9ED; --ink-2:#CCD1D9; --ink-3:#8B94A0;
  --paper:#1C2126; --surface:#262B33; --line:#38404B; --line-2:#2E343D;
  --run:#5D9CEC; --run-bg:#1E3350; --wait:#FFCE54; --wait-bg:#3A2F12;
  --done:#48CFAD; --done-bg:#123529; --late:#ED5565; --late-bg:#3B1519;
  --pause:#AAB2BD; --pause-bg:#2B3038; --side:#14171B; --side-2:#1E232B;
  --pri-hi:#FC6E51; --pri-mid:#4FC1E9; --pri-lo:#A0D468;
  --accent:#EC87C0; --accent-2:#AC92EC;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);font-size:14.5px;line-height:1.5;color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.hidden{display:none!important}
h1,h2,h3{margin:0;line-height:1.25}
h1{font-size:21px;font-weight:700;letter-spacing:-.01em}
h2{font-size:15.5px;font-weight:600}
h3{font-size:14.5px;font-weight:600}
.muted{color:var(--ink-3)} .small{font-size:12.5px}
a{color:var(--run)}
svg.i{width:18px;height:18px;flex:none}

/* ===== Khung: thanh bên + vùng làm việc ===== */
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.app.collapsed{grid-template-columns:68px 1fr}
.side{background:var(--side);color:#fff;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:14px 10px;overflow-y:auto;z-index:40}
.side .brand{display:flex;align-items:center;gap:9px;padding:2px 4px 18px}
.brand-chip{flex:none;width:38px;height:38px;border-radius:9px;background:#fff;display:grid;place-items:center;padding:4px}
.brand-chip img{width:100%;height:100%;object-fit:contain}
.brand-txt{font-weight:700;font-size:13.5px;line-height:1.3;min-width:0}
.brand-txt small{display:block;font-weight:400;font-size:11px;opacity:.7}
.side nav{display:grid;gap:2px}
.side .nv{display:flex;align-items:center;gap:11px;border:0;background:none;color:rgba(255,255,255,.72);padding:10px 12px;border-radius:8px;text-align:left;font-weight:500;width:100%;position:relative}
.side .nv:hover{background:rgba(255,255,255,.07);color:#fff}
.side .nv[aria-current="page"]{background:var(--side-2);color:#fff}
.side .nv[aria-current="page"]::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--accent)}
.side .nv .cnt{margin-left:auto;background:var(--grapefruit);color:#fff;font-size:11px;font-weight:700;border-radius:9px;padding:0 7px;min-width:20px;text-align:center}
.side .sep{height:1px;background:rgba(255,255,255,.1);margin:12px 6px}
.side .grow{flex:1}
.side .foot{display:grid;gap:2px}
.side .who{display:flex;align-items:center;gap:9px;padding:10px 8px 4px;font-size:13px}
.side .who .av{background:rgba(255,255,255,.14);color:#fff}
.app.collapsed .side .lbl,.app.collapsed .brand-txt,.app.collapsed .side .who span,.app.collapsed .side .nv .cnt{display:none}
.app.collapsed .side .nv{justify-content:center;padding:10px 0}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:1px solid var(--line)}
.topbar{display:flex;align-items:center;gap:10px;padding:12px 22px}
.search{flex:1;max-width:460px;position:relative}
.search input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 14px 9px 38px;min-height:40px}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.topbar .sp{flex:1}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:0 22px 12px}
.filters .flab{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink-2)}
.filters select{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:6px 10px;font-size:13.5px;min-height:34px;max-width:200px}
.filters .reset{border:0;background:none;color:var(--run);font-size:13px;font-weight:600;padding:6px}
.content{padding:18px 22px 40px;width:100%;max-width:1440px}
.page-h{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.page-h h1{flex:1}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:40px;height:40px;display:grid;place-items:center;position:relative;flex:none}
.dot-count{position:absolute;top:-4px;right:-4px;background:var(--late);color:#fff;font-size:11px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
.chipuser{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px 4px 4px;font-size:13px;font-weight:600}
.menu-btn{display:none}
.tabbar{display:none}

@media (max-width:900px){
  .app,.app.collapsed{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:260px;transform:translateX(-100%);transition:transform .2s}
  .app.drawer .side{transform:none;box-shadow:8px 0 30px rgba(0,0,0,.3)}
  .app.drawer::after{content:"";position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:35}
  .menu-btn{display:grid}
  .topbar{padding:calc(8px + env(safe-area-inset-top)) 12px 8px}
  .chipuser,.topbar .newbtn span{display:none}
  .page-h h1{flex-basis:100%}
  .topbar .sp{display:none}
  .search{max-width:none}
  .filters{padding:0 12px 10px;flex-wrap:nowrap;overflow-x:auto}
  .filters .flab{display:none}
  .content{padding:14px 12px calc(84px + env(safe-area-inset-bottom))}
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
  .tabbar button{flex:1;border:0;background:none;padding:8px 2px 9px;font-size:11px;font-weight:500;color:var(--ink-3);display:flex;flex-direction:column;align-items:center;gap:2px}
  .tabbar button svg{width:21px;height:21px}
  .tabbar button[aria-current="page"]{color:var(--ink)}
}

/* ===== Nút & ô nhập ===== */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:8px 14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.good{background:var(--done);border-color:var(--done);color:#fff}
.btn.warn{color:var(--late);border-color:var(--late-bg)}
.btn.ghost{border-color:transparent;background:none}
.btn:disabled{opacity:.5;cursor:default}
.btn.sm{min-height:30px;padding:4px 10px;font-size:13px}
.btn.block{width:100%}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.field>span{font-size:13px;font-weight:600;color:var(--ink-2)}
.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:8px 11px;min-height:40px}
textarea.input{min-height:80px;resize:vertical}
.input:focus{border-color:var(--run);outline:none;box-shadow:0 0 0 3px var(--run-bg)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>.grow{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 12px;font-weight:500;font-size:13.5px;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip small{opacity:.7;font-weight:400}

/* ===== Trạng thái ===== */
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.tag::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-run{color:var(--run);background:var(--run-bg)} .s-wait{color:var(--wait);background:var(--wait-bg)}
.s-done{color:var(--done);background:var(--done-bg)} .s-late{color:var(--late);background:var(--late-bg)}
.s-pause{color:var(--pause);background:var(--pause-bg)}
.pri{font-size:12px;font-weight:600;color:var(--ink-3);white-space:nowrap}
.pri.p3{color:var(--pri-hi)} .pri.p2{color:var(--pri-mid)} .pri.p1{color:var(--pri-lo)}
.warn-text{color:var(--late);font-weight:600} .soon-text{color:var(--wait);font-weight:600} .ok-text{color:var(--done);font-weight:600}
.bar{height:6px;border-radius:3px;background:var(--line-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--run);border-radius:3px}
.av{width:30px;height:30px;border-radius:50%;background:var(--run-bg);color:var(--run);display:grid;place-items:center;font-size:11.5px;font-weight:700;flex:none}
.avs{display:flex}
.avs .av{width:26px;height:26px;font-size:10.5px;border:2px solid var(--surface);margin-left:-6px}
.avs .av:first-child{margin-left:0}

/* ===== Thẻ, bảng tổng quan ===== */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.panel>.ph{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.panel>.ph h2{flex:1}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:14px}
@media (max-width:1200px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;text-align:left;border-top:3px solid var(--k,var(--ink-3))}
button.kpi{cursor:pointer} button.kpi:hover{border-color:var(--ink-3);border-top-color:var(--k)}
.kpi b{display:block;font-size:28px;line-height:1.1;font-weight:700;color:var(--k,var(--ink))}
.kpi span{font-size:13px;color:var(--ink-2);font-weight:500}
.dgrid{display:grid;gap:14px;grid-template-columns:repeat(12,minmax(0,1fr))}
.dgrid>*{min-width:0}
.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
@media (max-width:1100px){.c4,.c5,.c6,.c7,.c8{grid-column:span 12}}
.legend{display:grid;gap:6px;font-size:13.5px}
.legend div{display:flex;align-items:center;gap:8px}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.hbar{display:grid;gap:12px}
.hbar .r{display:grid;grid-template-columns:110px 1fr 70px;gap:10px;align-items:center;font-size:13.5px}
.hbar .track{height:14px;border-radius:4px;background:var(--line-2);overflow:hidden;display:flex}
.hbar .track i{display:block;height:100%}
.load{display:grid;gap:9px}
.load .who{display:grid;grid-template-columns:minmax(120px,1fr) 2fr 132px;gap:10px;align-items:center;font-size:13.5px}
.load .who .bar{height:10px}
.load .over i{background:var(--late)} .load .idle i{background:var(--done)}
.mini{display:grid;grid-template-columns:minmax(0,1fr)}
.mini .it{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line-2);border-left:0;border-right:0;border-top:0;background:none;width:100%;text-align:left}
.mini .it:last-child{border-bottom:0}
.mini .it .grow{flex:1;min-width:0}
.mini .it .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .it .m{font-size:12.5px;color:var(--ink-3)}
.mini .it:hover .t{color:var(--run)}
.empty{padding:24px 16px;text-align:center;color:var(--ink-3);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
.panel .empty{border:0;padding:16px}
.banner{border:1px solid var(--wait);background:var(--wait-bg);border-radius:var(--r);padding:12px 16px;margin-bottom:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner .grow{flex:1}

/* ===== Báo cáo tiến độ (Việc của tôi) ===== */
.rep{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(360px,1fr))}
@media (max-width:420px){.rep{grid-template-columns:1fr}}
.rc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px;border-left:4px solid var(--run)}
.rc.late{border-left-color:var(--late)} .rc.okd{border-left-color:var(--done)}
.rc .t{font-weight:600;border:0;background:none;padding:0;text-align:left;line-height:1.35}
.rc .t:hover{color:var(--run)}
.rc .m{font-size:12.5px;color:var(--ink-3);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.rc .sl{display:flex;gap:10px;align-items:center}
.rc .sl output{font-weight:700;font-size:18px;min-width:52px;text-align:right}
.rc textarea{min-height:40px;height:40px}
input[type=range]{width:100%;accent-color:var(--ink);height:28px}

/* ===== Kanban ===== */
.kb{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:12px;overflow-x:auto;padding-bottom:10px;align-items:start}
.col{background:var(--line-2);border-radius:var(--r);padding:10px;min-height:200px;border:2px dashed transparent}
.col.over{border-color:var(--run);background:var(--run-bg)}
.col .ch{display:flex;align-items:center;gap:8px;padding:2px 4px 10px;font-weight:600;font-size:13.5px}
.col .ch i{width:10px;height:10px;border-radius:50%}
.col .ch .n{margin-left:auto;color:var(--ink-3);font-weight:500}
.kc{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 11px;margin-bottom:8px;display:grid;gap:7px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.04);width:100%;text-align:left}
.kc:hover{border-color:var(--ink-3)}
.kc[draggable="true"]{cursor:grab}
.kc.dragging{opacity:.5}
.kc .t{font-weight:600;font-size:13.5px;line-height:1.35}
.kc .m{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-3)}
.kc .m .grow{flex:1}

/* ===== Danh sách (bảng) ===== */
.tblwrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th,.tbl td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl th{font-size:12px;color:var(--ink-3);font-weight:600;white-space:nowrap;background:var(--surface);position:sticky;top:0}
.tbl th[data-sort]{cursor:pointer;user-select:none}
.tbl th[data-sort]:hover{color:var(--ink)}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{background:var(--paper)}
.tbl tr:last-child td{border-bottom:0}
.tbl td.t{font-weight:600;min-width:220px}
.tbl .pc{display:flex;align-items:center;gap:8px;min-width:110px}
.tbl .pc .bar{flex:1}
.nowrap{white-space:nowrap}

/* ===== Lịch trình ===== */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--line);gap:1px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.cal .dh{background:var(--surface);padding:8px;font-size:12px;font-weight:600;color:var(--ink-3);text-align:center}
.cal .d{background:var(--surface);min-height:108px;padding:6px;display:flex;flex-direction:column;gap:3px}
.cal .d.out{background:var(--paper)} .cal .d.out .dn{opacity:.45}
.cal .d.today .dn{background:var(--ink);color:var(--paper);border-radius:999px;padding:0 7px}
.cal .d.wkend{background:color-mix(in srgb,var(--surface) 90%,var(--line))}
.cal .dn{font-size:12px;font-weight:600;align-self:flex-start}
.cal .ev{border:0;text-align:left;font-size:11.5px;font-weight:600;padding:2px 6px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%}
.cal .more{font-size:11px;color:var(--ink-3);border:0;background:none;text-align:left;padding:0 6px}
.agenda{display:none}
@media (max-width:760px){.cal{display:none}.agenda{display:block}}

/* ===== Dòng hoạt động ===== */
.feed{display:grid}
.fe{display:grid;grid-template-columns:30px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line-2)}
.fe:last-child{border-bottom:0}
.fe .tx{font-size:13.5px}
.fe .tk{border:0;background:none;padding:0;color:var(--run);font-weight:600;text-align:left;font-size:13px}
.fe .q{white-space:pre-wrap;word-break:break-word;color:var(--ink);margin-top:2px}

/* ===== Chi tiết việc (ngăn trượt phải) ===== */
.scrim{position:fixed;inset:0;background:rgba(10,20,30,.45);z-index:50}
.sheet{position:fixed;z-index:60;background:var(--paper);top:0;bottom:0;right:0;width:min(640px,100vw);overflow-y:auto;box-shadow:-8px 0 30px rgba(0,0,0,.18);padding-bottom:env(safe-area-inset-bottom)}
.sheet-head{position:sticky;top:0;z-index:2;background:var(--paper);display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid var(--line)}
.sheet-head .grow{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-body{padding:16px;display:grid;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card h3{margin-bottom:10px}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 10px;font-size:13.5px}
.kv dt{color:var(--ink-3)} .kv dd{margin:0}
.route{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding-top:4px}
.route::before{content:"";position:absolute;left:10%;right:10%;top:13px;height:6px;background:repeating-linear-gradient(90deg,var(--line) 0 3px,transparent 3px 11px),linear-gradient(var(--line),var(--line)) 0 0/100% 2px no-repeat,linear-gradient(var(--line),var(--line)) 0 100%/100% 2px no-repeat}
.route .st{position:relative;text-align:center;font-size:11.5px;line-height:1.3;color:var(--ink-3);padding:0 2px}
.route .st i{display:block;width:16px;height:16px;border-radius:50%;margin:0 auto 6px;background:var(--surface);border:3px solid var(--line);position:relative;z-index:1}
.route .st.past{color:var(--ink-2)} .route .st.past i{background:var(--done);border-color:var(--done)}
.route .st.now{color:var(--ink);font-weight:700} .route .st.now i{background:var(--wait);border-color:var(--wait);box-shadow:0 0 0 4px var(--wait-bg)}
.route .st.now.fin i{background:var(--done);border-color:var(--done);box-shadow:0 0 0 4px var(--done-bg)}
.exe{display:grid;grid-template-columns:1fr 64px;gap:4px 12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line-2);font-size:13.5px}
.exe:last-child{border-bottom:0}
.exe .pct{text-align:right;font-weight:700}
.exe .sub{grid-column:1/-1;display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--ink-3)}
.overall{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.overall b{font-size:30px;line-height:1}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.tl{display:grid}
.ev2{display:grid;grid-template-columns:30px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line-2)}
.ev2:last-child{border-bottom:0}
.ev2.sys .av{background:var(--line-2);color:var(--ink-3)}
.ev2 .who{font-size:13px}
.ev2 .body{white-space:pre-wrap;word-break:break-word;margin-top:2px}
.ev2.sys .body{color:var(--ink-2);font-size:13.5px}
.atts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.atts a{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:var(--r-sm);padding:4px 8px;font-size:13px;text-decoration:none;color:var(--ink);background:var(--paper);max-width:100%}
.atts img{width:96px;height:96px;object-fit:cover;border-radius:var(--r-sm);border:1px solid var(--line);display:block}
.composer{position:sticky;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:grid;gap:8px}
.pending{display:flex;flex-wrap:wrap;gap:6px}
.pending span{font-size:12px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 8px}

/* ===== Hộp thoại, bảng thông báo ===== */
.modal{position:fixed;z-index:80;inset:0;display:grid;place-items:center}
.modal .scrim{z-index:0}
.modal .box{position:relative;z-index:1;background:var(--paper);width:min(580px,100vw);max-height:92vh;overflow-y:auto;border-radius:14px;padding:20px}
@media (max-width:640px){.modal{place-items:end center}.modal .box{border-radius:14px 14px 0 0;padding-bottom:calc(20px + env(safe-area-inset-bottom))}}
.modal .box h2{margin-bottom:14px;font-size:17px}
.npanel{position:fixed;z-index:70;top:62px;right:18px;width:min(400px,calc(100vw - 24px));max-height:70vh;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.18)}
.npanel .nh{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line-2)}
.npanel .nh h2{flex:1}
.npanel .nl{overflow-y:auto}
.ni{display:flex;gap:10px;padding:11px 14px;border:0;border-bottom:1px solid var(--line-2);background:none;width:100%;text-align:left;font-size:13.5px}
.ni:hover{background:var(--paper)}
.ni.unread{background:var(--wait-bg)}
.ni .dot{width:8px;height:8px;border-radius:50%;background:var(--wait);margin-top:6px;flex:none}
.ni:not(.unread) .dot{background:transparent}
.toast{position:fixed;z-index:100;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;font-weight:500;max-width:90vw;box-shadow:var(--shadow)}
@media (max-width:900px){.toast{bottom:calc(84px + env(safe-area-inset-bottom))}}
.toast.err{background:var(--late);color:#fff}
.toast.clickable{cursor:pointer}

/* ===== Đăng nhập ===== */
.auth{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--side)}
.auth .box{background:var(--paper);border-radius:14px;padding:26px 22px;width:min(400px,100%)}
.auth .mark{display:flex;flex-direction:column;align-items:flex-start;gap:14px;margin-bottom:18px}
.brand-logo{width:min(230px,72vw);height:auto;display:block}
:root[data-theme="dark"] .brand-logo{background:#fff;border-radius:8px;padding:8px}
.auth h1{font-size:19px}
.auth p{margin:0 0 16px;color:var(--ink-2);font-size:14px}
.err-msg{color:var(--late);font-size:14px;margin:-4px 0 12px}
.pwbox{font-family:ui-monospace,Consolas,monospace;background:var(--wait-bg);padding:1px 6px;border-radius:4px;font-weight:700}
.scrollx{overflow-x:auto}
@media (prefers-reduced-motion:no-preference){.sheet{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}
</style>
</head>

/* ---------------- gọi API ---------------- */
async function api(action, data = {}, opt = {}) {
  let r;
  try {
    r = await fetch(API_URL + '/api', { method: 'POST', headers: { 'content-type': 'application/json', ...(S.tok ? { Authorization: 'Bearer ' + S.tok } : {}) }, body: JSON.stringify({ action, ...data }) });
  } catch (e) { throw new Error('Không kết nối được máy chủ. Kiểm tra mạng rồi thử lại.'); }
  let j; try { j = await r.json(); } catch { throw new Error('Máy chủ trả lời không hợp lệ (mã ' + r.status + ')'); }
  if (!j.ok) {
    if (j.code === 'HET_PHIEN' && S.tok) { logout(); if (!opt.quiet) toast(j.msg, true); }
    if (j.code === 'DOI_MAT_KHAU') renderChangePw(true);
    const e = new Error(j.msg || 'Có lỗi xảy ra'); e.code = j.code; throw e;
  }
  return j;
}
function toast(msg, err, onClick) {
  const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : '') + (onClick ? ' clickable' : ''); t.setAttribute('role', 'status'); t.textContent = msg;
  if (onClick) t.onclick = () => { t.remove(); onClick(); };
  document.body.appendChild(t); setTimeout(() => t.remove(), onClick ? 7000 : err ? 4500 : 2600);
}
async function guard(fn, btn) {
  if (btn) btn.disabled = true;
  try { return await fn(); } catch (e) { if (e.code !== 'HET_PHIEN') toast(e.message, true); } finally { if (btn) btn.disabled = false; }
}
function logout() { S.tok = ''; S.me = null; localStorage.removeItem('qlcv_tok'); clearInterval(S.timer); document.title = 'Theo dõi công việc'; renderLogin(); }

async function load(quiet) {
  const j = await api('data.boot', {}, { quiet });
  S.skew = j.now - Date.now();
  S.me = j.me; S.users = j.users; S.U = Object.fromEntries(j.users.map((u) => [u.id, u])); S.depts = j.depts;
  S.cfg = j.cfg; S.unread = j.unread; S.files = j.files; S.tg = j.tg;
  const byT = {};
  j.members.forEach((m) => (byT[m.task_id] = byT[m.task_id] || []).push(m));
  S.tasks = j.tasks.map((t) => enrich(t, byT[t.id] || []));
}
function enrich(t, ms) {
  const me = S.me.id, n = now();
  t.ms = ms; t.exes = ms.filter((m) => m.role === 'exe'); t.sups = ms.filter((m) => m.role === 'sup').map((m) => m.user_id);
  t.iExe = t.exes.find((m) => m.user_id === me); t.iSup = t.sups.includes(me); t.iChair = t.chair_id === me;
  t.working = t.status === 'da_giao' || t.status === 'dang_trien_khai';
  t.late = t.working && t.deadline < n;
  t.soon = t.working && !t.late && t.deadline - n < DAY;
  t.grp = t.status === 'hoan_thanh' ? 'done' : t.status === 'tam_dung' ? 'pause' : t.status.startsWith('trinh') ? 'wait' : t.late ? 'late' : 'run';
  const ds = dayStart(n);
  t.stale = t.working ? t.exes.filter((m) => !m.last_update || m.last_update < ds).map((m) => m.user_id) : [];
  const isTP = S.me.role === 'tp' && S.me.dept_id === t.dept_id;
  t.needMe = (t.status === 'trinh_ld_phong' && (isTP || (['tp', 'pp'].includes(S.me.role) && (t.iChair || t.iSup)))) || (t.status === 'trinh_ld_cty' && (S.me.role === 'bgd' || isTP));
  t.fold = fold(t.title);

}
const tagOf = (t) => (t.late ? ['Quá hạn', 's-late'] : ST[t.status]);

/* Kỳ báo cáo — việc thuộc kỳ: đang mở trong kỳ (kể cả kéo từ kỳ trước); việc hoàn thành chỉ tính trong kỳ nó hoàn thành */
function rangeOf(k) {
  const n = now(), ds = dayStart(n), p = vnParts(n), dow = (p.dow + 6) % 7, wk = ds - dow * DAY;
  if (k === 'today') return [ds, ds + DAY - 1];
  if (k === 'week') return [wk, wk + 7 * DAY - 1];
  if (k === 'lastweek') return [wk - 7 * DAY, wk - 1];
  if (k === 'month' || k === 'lastmonth') {
    let y = p.y, m = p.m - (k === 'lastmonth' ? 1 : 0); if (m < 1) { m = 12; y--; }
    return [Date.UTC(y, m - 1, 1) - VN, Date.UTC(m === 12 ? y + 1 : y, m === 12 ? 0 : m, 1) - VN - 1];
  }
  if (k === 'quarter') { const q = Math.floor((p.m - 1) / 3); return [Date.UTC(p.y, q * 3, 1) - VN, Date.UTC(q === 3 ? p.y + 1 : p.y, q === 3 ? 0 : q * 3 + 3, 1) - VN - 1]; }
  if (k === 'custom') { const a = S.f.from ? fromVN(S.f.from, '00:00') : 0; const b = S.f.to ? fromVN(S.f.to, '23:59') + 59999 : 9e15; return [a, b]; }
  return [0, 9e15];
}
const PERIODS = [['all', 'Mọi thời gian'], ['week', 'Tuần này'], ['lastweek', 'Tuần trước'], ['month', 'Tháng này'], ['lastmonth', 'Tháng trước'], ['quarter', 'Quý này'], ['custom', 'Tự chọn…']];
function pool() {
  const f = S.f, [a, b] = rangeOf(f.period), q = fold(f.q.trim());
  return S.tasks.filter((t) => {
    if (f.dept && t.dept_id !== +f.dept) return false;
    if (f.lead && t.chair_id !== +f.lead && !t.sups.includes(+f.lead)) return false;
    if (f.exe && !t.exes.some((m) => m.user_id === +f.exe)) return false;
    if (f.pri && t.priority !== +f.pri) return false;
    if (f.period !== 'all' && !(t.created_at <= b && (!t.completed_at || t.completed_at >= a))) return false;
    if (q && !t.fold.includes(q)) return false;
    return true;
  });
}

/* ---------------- thăm dò thông báo (kênh chính) ---------------- */
function startPolling() {
  clearInterval(S.timer);
  S.timer = setInterval(pollTick, 30000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && S.me) pollTick(); });
}
async function pollTick() {
  if (document.hidden || !S.me || S.me.role === 'admin' || S.polling) return;
  S.polling = true;
  try {
    const c = await api('notif.count', {}, { quiet: true });
    const fresh = c.latest > S.latest;
    const prev = S.latest; S.latest = c.latest; S.unread = c.unread; updateBadges();
    if (fresh && prev) {
      const nl = await api('notif.list', {}, { quiet: true });
      const news = nl.items.filter((n) => n.id > prev);
      if (news.length) {
        const first = news[0];
        toast(news.length > 1 ? `${news.length} thông báo mới — bấm để xem` : first.text, false, () => (first.task_id && news.length === 1 ? openTask(first.task_id) : openNotifs()));
        if ('Notification' in window && Notification.permission === 'granted' && localStorage.getItem('qlcv_desk') === '1') {
          news.slice(0, 3).forEach((n) => { try { const x = new Notification('Theo dõi công việc', { body: n.text, icon: 'icon-192.png', tag: 'qlcv-' + n.id }); x.onclick = () => { window.focus(); n.task_id && openTask(n.task_id); x.close(); }; } catch {} });
        }
      }
    }
    // làm mới dữ liệu định kỳ; không vẽ lại khi người dùng đang nhập liệu
    if (fresh || !S.lastLoad || Date.now() - S.lastLoad > 90e3) {
      await load(true); S.lastLoad = Date.now(); S.feed = null;
      const typing = Object.keys(S.drafts).length && S.view === 'mine';
      if (!typing && !document.querySelector('.modal') && !S.detail && !S.dragging && !document.activeElement?.matches('input,textarea,select')) renderView();
    }
  } catch {} finally { S.polling = false; }
}
function updateBadges() {
  const u = $('#unread'); if (u) { u.textContent = S.unread > 99 ? '99+' : S.unread; u.classList.toggle('hidden', !S.unread); }
  document.title = (S.unread ? `(${S.unread}) ` : '') + 'Theo dõi công việc';
  const staleMine = S.tasks.filter((t) => t.iExe && t.stale.includes(S.me.id)).length;
  const need = S.tasks.filter((t) => t.needMe).length;
  const mc = $('#cnt-mine'); if (mc) { mc.textContent = staleMine + need; mc.classList.toggle('hidden', !(staleMine + need)); }
}

  h += `<div class="page-h" style="margin:4px 0 10px"><h2>Báo cáo tiến độ hôm nay</h2><span class="muted small">Kéo thanh % và/hoặc ghi chú tình hình cho từng việc</span></div>`;
  h += mine.length ? `<div class="rep">${mine.map((t) => {
    const m = t.iExe, d = S.drafts[t.id] || {}, pct = d.pct ?? m.pct, done = m.last_update >= ds;
    const [lab, cls] = tagOf(t);
    return `<div class="rc ${t.late ? 'late' : done ? 'okd' : ''}" data-rc="${t.id}">
      <button class="t" data-open="${t.id}">${esc(t.title)}</button>
      <div class="m"><span class="tag ${cls}">${lab}</span>${t.priority === 3 ? '<span class="pri p3">Ưu tiên cao</span>' : ''}<span>Hạn ${fmtShort(t.deadline)} · <span class="${t.late ? 'warn-text' : t.soon ? 'soon-text' : ''}">${rel(t.deadline)}</span></span><span>Chủ trì: ${esc(short(t.chair_id))}</span></div>
      <div class="sl"><input type="range" min="0" max="100" step="5" value="${pct}" data-pct="${t.id}" aria-label="Tiến độ ${esc(t.title)}"><output>${pct}%</output></div>
      <textarea class="input" data-note="${t.id}" placeholder="Ghi chú hôm nay (không bắt buộc)">${esc(d.note || '')}</textarea>
      <div class="row"><span class="small grow ${done ? 'ok-text' : 'soon-text'}">${done ? 'Đã cập nhật lúc ' + fmtShort(m.last_update).slice(0, 5) : 'Chưa cập nhật hôm nay'}</span>
        ${t.exes.length > 1 ? `<span class="small muted">Chung: ${t.overall_pct}%</span>` : ''}<button class="btn sm" data-save="${t.id}">Lưu</button></div></div>`;
  }).join('')}</div>` : '<div class="empty">Anh/chị không có việc nào đang thực hiện.</div>';
  if (paused.length) h += `<section class="panel" style="margin-top:14px"><div class="ph"><h2>Đang tạm dừng</h2></div><div class="mini">${paused.map((t) => miniRow(t, true)).join('')}</div></section>`;
  if (waiting.length) h += `<section class="panel" style="margin-top:14px"><div class="ph"><h2>Đã trình, đang chờ duyệt</h2></div><div class="mini">${waiting.map((t) => miniRow(t, true)).join('')}</div></section>`;
  if (lead.length) h += `<section class="panel" style="margin-top:14px"><div class="ph"><h2>Tôi chủ trì / giám sát</h2><span class="muted small">${lead.length} việc</span></div><div class="mini">${lead.map((t) => miniRow(t)).join('')}</div></section>`;
  $('#view').innerHTML = h; bindOpen($('#view'));
  const dirty = () => { const n = Object.keys(S.drafts).length; const b = $('#saveall'); if (b) { b.disabled = !n; b.textContent = n ? `Lưu tất cả thay đổi (${n})` : 'Lưu tất cả thay đổi'; } };
  const setDraft = (id, k, v) => {
    const t = S.tasks.find((x) => x.id === id), d = { ...(S.drafts[id] || {}), [k]: v };
    if ((d.pct === undefined || d.pct === t.iExe.pct) && !(d.note || '').trim()) delete S.drafts[id]; else S.drafts[id] = d;
    dirty();
  };
  $$('[data-pct]').forEach((i) => (i.oninput = () => { i.nextElementSibling.textContent = i.value + '%'; setDraft(+i.dataset.pct, 'pct', +i.value); }));
  $$('[data-note]').forEach((i) => (i.oninput = () => setDraft(+i.dataset.note, 'note', i.value)));
  const saveOne = async (id) => {
    const t = S.tasks.find((x) => x.id === id), d = S.drafts[id] || {};
    const pct = d.pct ?? t.iExe.pct, note = (d.note || '').trim();
    if (pct === t.iExe.pct && !note) { if (t.stale.includes(S.me.id)) throw new Error('Kéo thanh % hoặc ghi chú trước khi lưu'); return null; }
    const r = await api('task.progress', { id, pct, note });
    delete S.drafts[id]; return r;
  };
  const after = async (results) => {
    await load(true); S.lastLoad = Date.now(); viewMine(); updateBadges();
    const ready = results.filter((x) => x && x.r && x.r.allDone).map((x) => S.tasks.find((t) => t.id === x.id)).filter(Boolean);
    for (const t of ready) if (confirm(`"${t.title}": tất cả người thực hiện đã đạt 100%. Trình Lãnh đạo phòng duyệt ngay?`)) await guard(() => api('task.status', { id: t.id, op: 'submit' }));
    if (ready.length) { await load(true); viewMine(); }
  };
  $$('[data-save]').forEach((b) => (b.onclick = () => guard(async () => { const id = +b.dataset.save; const r = await saveOne(id); toast(r ? 'Đã lưu tiến độ' : 'Không có thay đổi'); await after([{ id, r }]); }, b)));
  if ($('#saveall')) $('#saveall').onclick = (e) => guard(async () => {
    const ids = Object.keys(S.drafts).map(Number), res = [];
    for (const id of ids) res.push({ id, r: await saveOne(id) });
    toast(`Đã lưu ${res.filter((x) => x.r).length} việc`); await after(res);
  }, e.target);
  dirty();
}

/* ---------------- 3. Kanban ---------------- */
const COLS = [['giao', 'Đã giao', 'var(--run)'], ['lam', 'Đang triển khai', 'var(--run)'], ['ldp', 'Chờ LĐ phòng duyệt', 'var(--wait)'], ['ldc', 'Chờ LĐ công ty duyệt', 'var(--wait)'], ['xong', 'Hoàn thành', 'var(--done)']];
const colOf = (t) => ({ da_giao: 'giao', dang_trien_khai: 'lam', tam_dung: 'lam', trinh_ld_phong: 'ldp', trinh_ld_cty: 'ldc', hoan_thanh: 'xong' })[t.status];
function viewKanban() {
  const P = pool(), by = {}; COLS.forEach((c) => (by[c[0]] = []));
  P.forEach((t) => by[colOf(t)].push(t));
  Object.values(by).forEach(sortTasks);
  by.xong.sort((a, b) => b.completed_at - a.completed_at);
  let h = `<div class="page-h"><h1>Kanban</h1><span class="muted small">Kéo thẻ sang cột kế tiếp để trình / duyệt; kéo ngược về "Đang triển khai" để trả lại. Hệ thống tự kiểm tra quyền.</span></div><div class="kb">`;
  h += COLS.map(([k, l, c]) => `<div class="col" data-col="${k}"><div class="ch"><i style="background:${c}"></i>${l}<span class="n">${by[k].length}</span></div>
    ${by[k].map((t) => { const [lab, cls] = tagOf(t); return `<div class="kc" draggable="true" data-card="${t.id}" data-open="${t.id}" role="button" tabindex="0">
      <div class="t">${esc(t.title)}</div>
      <div class="m">${t.late || t.status === 'tam_dung' ? `<span class="tag ${cls}">${lab}</span>` : ''}<span class="pri ${'p' + t.priority}">${PRI[t.priority]}</span><span class="grow"></span><span class="${t.late ? 'warn-text' : t.soon ? 'soon-text' : ''}">${t.status === 'hoan_thanh' ? fmtDay(t.completed_at) : fmtDay(t.deadline)}</span></div>
      <div class="bar"><i style="width:${t.overall_pct}%;background:${grpColor[t.grp]}"></i></div>
      <div class="m"><span class="avs">${t.exes.slice(0, 4).map((m) => avatar(m.user_id)).join('')}</span>${t.exes.length > 1 ? `<span class="small ${t.exes.every((m) => m.pct >= 100) ? 'ok-text' : ''}">${t.exes.filter((m) => m.pct >= 100).length}/${t.exes.length} xong</span>` : ''}<span class="grow"></span><b style="color:var(--ink)">${t.overall_pct}%</b></div></div>`; }).join('') || '<div class="small muted" style="padding:6px">Trống</div>'}</div>`).join('');
  $('#view').innerHTML = h + '</div>'; bindOpen($('#view'));
  $$('.kc').forEach((c) => {
    c.onkeydown = (e) => { if (e.key === 'Enter') openTask(+c.dataset.card); };
    c.ondragstart = (e) => { S.dragging = +c.dataset.card; c.classList.add('dragging'); e.dataTransfer.setData('text/plain', c.dataset.card); e.dataTransfer.effectAllowed = 'move'; };
    c.ondragend = () => { c.classList.remove('dragging'); S.dragging = null; $$('.col').forEach((x) => x.classList.remove('over')); };
  });
  $$('.col').forEach((col) => {
    col.ondragover = (e) => { e.preventDefault(); col.classList.add('over'); };
    col.ondragleave = () => col.classList.remove('over');
    col.ondrop = (e) => { e.preventDefault(); col.classList.remove('over'); const id = +e.dataTransfer.getData('text/plain'); dropTo(id, col.dataset.col); };
  });
}
async function dropTo(id, to) {
  const t = S.tasks.find((x) => x.id === id); if (!t) return;
  const from = colOf(t); if (from === to) return;
  const order = COLS.map((c) => c[0]), fi = order.indexOf(from), ti = order.indexOf(to);
  let op = null, note = '';
  if ((from === 'giao' || from === 'lam') && to === 'ldp') op = 'submit';
  else if (from === 'ldp' && (to === 'ldc' || (to === 'xong' && !t.needs_company))) op = 'approve';
  else if (from === 'ldc' && to === 'xong') op = 'approve';
  else if ((from === 'ldp' || from === 'ldc') && to === 'lam') op = 'reject';
  else if (from === 'giao' && to === 'lam') return toast('Việc tự chuyển "Đang triển khai" khi người thực hiện cập nhật tiến độ lần đầu', true);
  if (!op) return toast(ti > fi ? 'Chỉ chuyển được sang bước kế tiếp của quy trình' : 'Không chuyển ngược được về cột này', true);
  if (op === 'submit') {
    const isTP = S.me.role === 'tp' && S.me.dept_id === t.dept_id, isChair = t.chair_id === S.me.id;
    const notDone = t.exes.filter((m) => m.pct < 100);
    if (!isTP && !isChair && notDone.length) {
      return openModal(`<h2>Chưa thể trình duyệt</h2><p>Việc <b>"${esc(t.title)}"</b> có ${t.exes.length} người thực hiện, tiến độ chung vẫn tính trung bình nên chưa đạt 100%:</p>
        <div class="mini">${notDone.map((m) => `<div class="it" style="cursor:default">${avatar(m.user_id)}<span class="grow"><b>${esc(nameOf(m.user_id))}</b></span><b>${m.pct}%</b></div>`).join('')}</div>
        <p class="small muted" style="margin-top:10px">Chỉ trình được khi tất cả người thực hiện đạt 100%, hoặc do người chủ trì/Trưởng phòng trình thay.</p>
        <div class="row" style="margin-top:6px"><span class="grow"></span><button class="btn primary" data-close>Đã hiểu</button></div>`);
    }
  }
  const msg = { submit: `Trình Lãnh đạo phòng duyệt việc "${t.title}"?`, approve: `Duyệt việc "${t.title}"?` }[op];
  if (op === 'reject') { note = prompt(`Trả lại việc "${t.title}". Lý do (bắt buộc):`) || ''; if (!note.trim()) return; }
  else if (!confirm(msg)) return;
  await guard(async () => { const r = await api('task.status', { id, op, note }); toast('Đã chuyển: ' + ST[r.status][0]); await load(true); S.lastLoad = Date.now(); renderView(); });
}

/* ---------------- 4. Danh sách (bảng) ---------------- */
function viewList() {
  const L = S.lst;
  let arr = pool().filter((t) => L.st === 'all' ? true : L.st === 'open' ? t.status !== 'hoan_thanh' : L.st === 'done' ? t.status === 'hoan_thanh' : t.grp === L.st);
  const key = { title: (t) => t.fold, chair: (t) => fold(nameOf(t.chair_id)), deadline: (t) => t.deadline, pri: (t) => -t.priority, status: (t) => ['da_giao', 'dang_trien_khai', 'tam_dung', 'trinh_ld_phong', 'trinh_ld_cty', 'hoan_thanh'].indexOf(t.status) - (t.late ? 10 : 0), pct: (t) => t.overall_pct, upd: (t) => -t.updated_at }[L.sort];
  arr.sort((a, b) => { const x = key(a), y = key(b); return (x < y ? -1 : x > y ? 1 : 0) * L.dir; });
  const sts = [['open', 'Chưa hoàn thành'], ['run', 'Đang thực hiện'], ['wait', 'Chờ duyệt'], ['late', 'Quá hạn'], ['pause', 'Tạm dừng'], ['done', 'Hoàn thành'], ['all', 'Tất cả']];
  const th = (k, l) => `<th data-sort="${k}" aria-sort="${L.sort === k ? (L.dir > 0 ? 'ascending' : 'descending') : 'none'}">${l}${L.sort === k ? (L.dir > 0 ? ' ↑' : ' ↓') : ''}</th>`;
  const staleRows = isLeader() && S.me.role !== 'bgd' ? S.tasks.filter((t) => (t.iChair || t.iSup || S.me.role === 'tp') && t.stale.length) : [];
  let h = `<div class="page-h"><h1>Danh sách công việc</h1><div class="seg" role="group" aria-label="Trạng thái" style="flex-wrap:wrap">${sts.map(([k, l]) => `<button data-lst="${k}" aria-pressed="${L.st === k}">${l}</button>`).join('')}</div></div>`;
  if (staleRows.length) {
    const pairs = []; staleRows.forEach((t) => t.stale.forEach((u) => pairs.push({ t, u })));
    h += `<details class="panel" style="margin-bottom:14px"><summary style="cursor:pointer;font-weight:600">Chưa cập nhật tiến độ hôm nay: <span class="soon-text">${pairs.length} lượt</span> <span class="muted small">(bấm để xem và nhắc)</span></summary>
      <div class="mini" style="margin-top:8px">${pairs.map(({ t, u }) => `<div class="it" style="cursor:default">${avatar(u)}<span class="grow"><div class="t" style="font-weight:600">${esc(nameOf(u))}</div><div class="m">${esc(t.title)}</div></span><button class="btn sm" data-nudge="${t.id}:${u}">Nhắc</button></div>`).join('')}</div></details>`;
  }
  h += arr.length ? `<div class="tblwrap"><table class="tbl"><thead><tr>${th('title', 'Công việc')}${th('chair', 'Chủ trì')}<th>Thực hiện</th>${th('deadline', 'Thời hạn')}${th('pri', 'Ưu tiên')}${th('status', 'Trạng thái')}${th('pct', 'Tiến độ')}${th('upd', 'Cập nhật')}</tr></thead><tbody>
    ${arr.map((t) => { const [lab, cls] = tagOf(t); return `<tr data-open="${t.id}"><td class="t">${esc(t.title)}${t.parent_id ? ' <span class="muted small">(việc con)</span>' : ''}</td><td class="nowrap">${esc(short(t.chair_id))}</td>
      <td><span class="avs">${t.exes.slice(0, 5).map((m) => avatar(m.user_id)).join('')}</span></td>
      <td class="nowrap">${fmtShort(t.deadline)}<div class="small ${t.late ? 'warn-text' : t.soon ? 'soon-text' : 'muted'}">${t.status === 'hoan_thanh' ? 'xong ' + fmtDay(t.completed_at) : rel(t.deadline)}</div></td>
      <td><span class="pri p${t.priority}">${PRI[t.priority]}</span></td><td><span class="tag ${cls}">${lab}</span></td>
      <td><div class="pc"><div class="bar"><i style="width:${t.overall_pct}%;background:${grpColor[t.grp]}"></i></div><b>${t.overall_pct}%</b></div>${t.stale.length ? `<div class="small soon-text">${t.stale.length} người chưa cập nhật</div>` : ''}</td>
      <td class="nowrap small muted">${ago(t.updated_at)}</td></tr>`; }).join('')}</tbody></table></div>
    <p class="small muted">${arr.length} công việc · lọc theo: ${periodLabel()}</p>` : '<div class="empty">Không có công việc nào khớp bộ lọc.</div>';
  $('#view').innerHTML = h; bindOpen($('#view'));
  $$('[data-lst]').forEach((b) => (b.onclick = () => { L.st = b.dataset.lst; viewList(); }));
  $$('[data-sort]').forEach((b) => (b.onclick = () => { const k = b.dataset.sort; if (L.sort === k) L.dir = -L.dir; else { L.sort = k; L.dir = 1; } viewList(); }));
  $$('[data-nudge]').forEach((b) => (b.onclick = () => guard(async () => { const [tid, uid] = b.dataset.nudge.split(':').map(Number); const r = await api('task.nudge', { id: tid, user_id: uid }); toast(r.skipped ? 'Vừa nhắc người này rồi' : 'Đã gửi nhắc nhở tới ' + nameOf(uid)); b.textContent = 'Đã nhắc'; b.disabled = true; }, b)));
}

/* ---------------- 5. Lịch trình ---------------- */
function viewCal() {
  const n = vnParts(now());
  if (!S.cal) S.cal = { y: n.y, m: n.m };
  const { y, m } = S.cal;
  const first = Date.UTC(y, m - 1, 1) - VN, startDow = (new Date(first + VN).getUTCDay() + 6) % 7;
  const gridStart = first - startDow * DAY, today = dayStart(now());
  const P = pool(), byDay = {};
  P.forEach((t) => { const k = dayStart(t.deadline); (byDay[k] = byDay[k] || []).push(t); });
  Object.values(byDay).forEach(sortTasks);
  const cells = [];
  for (let i = 0; i < 42; i++) {
    const d = gridStart + i * DAY, p = vnParts(d);
    if (i >= 35 && p.m !== m) break;
    const list = byDay[d] || [];
    cells.push(`<div class="d ${p.m !== m ? 'out' : ''} ${d === today ? 'today' : ''} ${p.dow === 0 || p.dow === 6 ? 'wkend' : ''}"><span class="dn">${p.d}</span>
      ${list.slice(0, 3).map((t) => `<button class="ev" data-open="${t.id}" style="background:${grpBg[t.grp]};color:${grpColor[t.grp]}" title="${esc(t.title)} — ${fmtShort(t.deadline)}">${esc(t.title)}</button>`).join('')}
      ${list.length > 3 ? `<button class="more" data-day="${d}">+${list.length - 3} việc nữa</button>` : ''}</div>`);
  }
  const mEnd = Date.UTC(m === 12 ? y + 1 : y, m === 12 ? 0 : m, 1) - VN;
  const inMonth = P.filter((t) => t.deadline >= first && t.deadline < mEnd).sort((a, b) => a.deadline - b.deadline);
  $('#view').innerHTML = `<div class="page-h"><h1>Lịch trình · Tháng ${m}/${y}</h1>
      <button class="iconbtn" id="cprev" aria-label="Tháng trước">${icon('back')}</button><button class="btn sm" id="ctoday">Hôm nay</button><button class="iconbtn" id="cnext" aria-label="Tháng sau">${icon('fwd')}</button></div>
    <p class="small muted" style="margin:-6px 0 12px">Công việc hiển thị theo ngày đến hạn. Màu: xanh đang làm, vàng chờ duyệt, đỏ quá hạn, xanh lá hoàn thành.</p>
    <div class="cal">${['Thứ 2', 'Thứ 3', 'Thứ 4', 'Thứ 5', 'Thứ 6', 'Thứ 7', 'CN'].map((x) => `<div class="dh">${x}</div>`).join('')}${cells.join('')}</div>
    <div class="agenda">${inMonth.length ? `<div class="panel"><div class="mini">${inMonth.map((t) => miniRow(t)).join('')}</div></div>` : '<div class="empty">Không có việc nào đến hạn trong tháng.</div>'}</div>`;
  bindOpen($('#view'));
  const mv = (k) => { let mm = S.cal.m + k, yy = S.cal.y; if (mm < 1) { mm = 12; yy--; } if (mm > 12) { mm = 1; yy++; } S.cal = { y: yy, m: mm }; viewCal(); };
  $('#cprev').onclick = () => mv(-1); $('#cnext').onclick = () => mv(1); $('#ctoday').onclick = () => { S.cal = null; viewCal(); };
  $$('[data-day]').forEach((b) => (b.onclick = () => { const list = byDay[+b.dataset.day]; openModal(`<h2>Đến hạn ngày ${fmtDay(+b.dataset.day)}</h2><div class="panel"><div class="mini">${list.map((t) => miniRow(t)).join('')}</div></div><div class="row" style="margin-top:12px"><span class="grow"></span><button class="btn" data-close>Đóng</button></div>`, (box) => $$('[data-open]', box).forEach((x) => (x.onclick = () => { closeModal(); openTask(+x.dataset.open); }))); }));
}

/* ---------------- 6. Hoạt động ---------------- */
async function loadFeed(limit) {
  if (S.feed && S.feed.limit >= limit && Date.now() - S.feed.at < 60e3) return S.feed.items.slice(0, limit);
  try { const j = await api('data.feed', { limit }, { quiet: true }); S.feed = { items: j.items, limit, at: Date.now() }; return j.items; } catch { return []; }
}
function actText(a) {
  const m = a.meta || {};
  switch (a.kind) {
    case 'create': return 'giao công việc';
    case 'comment': return (m.files ? 'gửi tệp đính kèm' : 'bình luận') + (m.mentions && m.mentions.length ? `, nhắc ${m.mentions.map((u) => esc(short(u))).join(', ')}` : '');
    case 'progress': return `cập nhật tiến độ ${m.from}% → <b>${m.to}%</b>`;
    case 'overall': return m.auto ? 'chuyển % chung về trung bình' : `chốt % chung <b>${m.to}%</b>`;
    case 'deadline': return `đổi thời hạn ${fmtShort(m.from)} → <b>${fmtShort(m.to)}</b>`;
    case 'nudge': return `nhắc ${m.mentions ? esc(short(m.mentions[0])) : ''} cập nhật tiến độ`;

function evHtml(a, files) {

async function addFiles(input) {
  const files = [...input.files]; input.value = '';
  for (const f of files) {
    if (f.size > 15 * 1024 * 1024 && !/^image\//.test(f.type)) { toast(`${f.name} vượt quá 15 MB`, true); continue; }
    S.pendingFiles.push(/^image\//.test(f.type) && f.type !== 'image/gif' ? await shrink(f) : f);
  }
  $('#pend').innerHTML = S.pendingFiles.map((f) => `<span>${esc(f.name)}</span>`).join('');
}
function shrink(file) {
  return new Promise((res) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const max = 1600, k = Math.min(1, max / Math.max(img.width, img.height));
      if (k === 1 && file.size < 600 * 1024) { URL.revokeObjectURL(url); return res(file); }
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob((b) => res(b ? new File([b], file.name.replace(/\.\w+$/, '') + '.jpg', { type: 'image/jpeg' }) : file), 'image/jpeg', 0.82);
    };
    img.onerror = () => { URL.revokeObjectURL(url); res(file); };
    img.src = url;
  });
}
async function upload(taskId, f) {
  const r = await fetch(`${API_URL}/upload?task=${taskId}`, { method: 'POST', headers: { Authorization: 'Bearer ' + S.tok, 'content-type': f.type || 'application/octet-stream', 'X-File-Name': encodeURIComponent(f.name) }, body: f });
  const j = await r.json().catch(() => ({ ok: false, msg: 'Tải tệp thất bại' }));
  if (!j.ok) throw new Error(j.msg || 'Tải tệp thất bại');
  return j;
}

    <div class="grid2"><label class="field"><span>Hạn hoàn thành – ngày</span><input class="input" type="date" name="d" required value="${toDateStr(dl)}"></label>
      <label class="field"><span>Giờ</span><input class="input" type="time" name="h" required value="${toTimeStr(dl)}"></label></div>
    <div class="field" id="reasonf" style="display:none"><span>Lý do đổi hạn</span><input class="input" name="reason" maxlength="500" placeholder="Ghi rõ để mọi người cùng nắm"></div>
    <div class="field"><span>Mức độ ưu tiên</span><div class="seg" role="group">${[3, 2, 1].map((p) => `<button type="button" data-pri="${p}" aria-pressed="${(t ? t.priority : 2) === p}">${PRI[p]}</button>`).join('')}</div></div>
    <label class="row" style="margin-bottom:16px"><input type="checkbox" name="nc" ${!t || t.needs_company ? 'checked' : ''} style="width:20px;height:20px"> <span>Cần trình Lãnh đạo công ty duyệt sau khi Lãnh đạo phòng duyệt</span></label>
    <div id="tferr" class="err-msg hidden"></div>
    <div class="row"><button type="button" class="btn ghost" data-close>Hủy bỏ</button><span class="grow"></span><button class="btn primary" id="tfsave">${editing ? 'Lưu thay đổi' : 'Giao việc'}</button></div></form>`, (box) => {
    const f = $('#tf', box);
    let pri = t ? t.priority : 2;
    $$('[data-pri]', box).forEach((b) => (b.onclick = () => { pri = +b.dataset.pri; $$('[data-pri]', box).forEach((x) => x.setAttribute('aria-pressed', x === b)); }));
    $$('.chip', box).forEach((b) => (b.onclick = () => b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') !== 'true')));
    if (editing) { const chk = () => ($('#reasonf', box).style.display = fromVN(f.d.value, f.h.value) !== t.deadline ? '' : 'none'); f.d.onchange = chk; f.h.onchange = chk; }
    if (f.chair) { f.chair.onchange = () => { const c = +f.chair.value; $$('[data-sup]', box).forEach((b) => { b.style.display = +b.dataset.sup === c ? 'none' : ''; if (+b.dataset.sup === c) b.setAttribute('aria-pressed', 'false'); }); }; f.chair.onchange(); }
    else if (!isSub) $$('[data-sup]', box).forEach((b) => { if (+b.dataset.sup === cur.chair) b.style.display = 'none'; });
    f.onsubmit = (e) => { e.preventDefault(); guard(async () => {
      const picked = (nm) => $$(`[data-${nm}][aria-pressed="true"]`, box).filter((b) => b.style.display !== 'none').map((b) => +b.dataset[nm]);
      const payload = { title: f.ttl.value.trim(), description: f.desc.value, executors: picked('exe'), priority: pri, deadline: fromVN(f.d.value, f.h.value), needs_company: f.nc.checked };
      if (!isSub) payload.supervisors = picked('sup');
      if (f.chair) payload.chair_id = +f.chair.value;
      const er = $('#tferr', box);
      if (!payload.executors.length) { er.textContent = 'Chọn ít nhất một người thực hiện'; er.classList.remove('hidden'); return; }
      if (editing) {
        if (payload.deadline !== t.deadline) payload.reason = f.reason.value.trim();
        await api('task.update', { id: t.id, ...payload }); closeModal(); toast('Đã lưu thay đổi'); await reloadDetail();
      } else {
        if (parent) payload.parent_id = parent.id;
        const r = await api('task.create', payload); closeModal(); toast('Đã giao việc và gửi thông báo');
        await load(true); S.lastLoad = Date.now(); S.feed = null;
        if (parent) openTask(r.id); else renderView();
      }
    }, $('#tfsave', box)); };
  });
}

/* ---------------- Hộp thoại chung ---------------- */
function openModal(html, onReady) {
  closeModal();
  document.body.insertAdjacentHTML('beforeend', `<div class="modal" role="dialog" aria-modal="true"><div class="scrim" data-close></div><div class="box">${html}</div></div>`);
  const m = document.querySelector('.modal');
  $$('[data-close]', m).forEach((b) => (b.onclick = closeModal));
  m.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
  const first = m.querySelector('input:not([type=checkbox]),select,textarea'); first && first.focus();
  if (onReady) onReady(m.querySelector('.box'));
}
function closeModal() { document.querySelector('.modal')?.remove(); }

/* ---------------- Bảng thông báo (kênh chính) ---------------- */
function closeNotifs() { $('#npanel')?.remove(); document.removeEventListener('click', S.nclose || (() => {})); }
async function openNotifs() {
  if ($('#npanel')) return closeNotifs();
  document.body.insertAdjacentHTML('beforeend', `<div class="npanel" id="npanel" role="dialog" aria-label="Thông báo"><div class="nh"><h2>Thông báo</h2><button class="btn sm ghost" id="nread">Đánh dấu đã đọc</button></div><div class="nl" id="nl"><div class="muted" style="padding:14px">Đang tải…</div></div></div>`);
  S.nclose = (e) => { if (!e.target.closest('#npanel') && !e.target.closest('#bell')) closeNotifs(); };
  setTimeout(() => document.addEventListener('click', S.nclose), 0);
  try {
    const j = await api('notif.list');
    $('#nl').innerHTML = j.items.length ? j.items.map((n) => `<button class="ni ${n.is_read ? '' : 'unread'}" ${n.task_id ? `data-nt="${n.task_id}"` : ''}><span class="dot"></span><span><div style="font-weight:${n.is_read ? 400 : 600}">${esc(n.text)}</div><div class="small muted">${ago(n.created_at)}</div></span></button>`).join('') : '<div class="empty" style="margin:14px">Chưa có thông báo.</div>';
    $$('[data-nt]', $('#npanel')).forEach((b) => (b.onclick = () => { closeNotifs(); openTask(+b.dataset.nt); }));
    $('#nread').onclick = async () => { await guard(() => api('notif.read')); S.unread = 0; updateBadges(); $$('.ni.unread').forEach((x) => x.classList.remove('unread')); };
    if (S.unread) { await api('notif.read'); S.unread = 0; updateBadges(); }
  } catch (e) { $('#nl') && ($('#nl').textContent = e.message); }
}

      <p class="small" style="margin:0 0 10px;color:var(--ink-2)">${S.me.tg_linked ? 'Đã kết nối — nhận thêm thông báo qua Telegram kể cả khi không mở ứng dụng.' : 'Nếu có dùng Telegram, kết nối để nhận thêm thông báo khi không mở ứng dụng.'}</p>
      <div class="row">${S.me.tg_linked ? '<button class="btn sm" id="tgun">Ngừng nhận qua Telegram</button>' : '<button class="btn sm" id="tgl">Kết nối Telegram</button>'}</div><p class="small muted" id="tghint" style="margin:8px 0 0"></p></div>` : ''}

    $('#bf', box).onsubmit = (e) => { e.preventDefault(); const f = e.target; guard(async () => {
      if (!d.depts.length) throw new Error('Tạo phòng ban trước');
      const r = await api('admin.bulkImport', { dept_id: +f.d.value, text: f.t.value }); closeModal(); showPw(r.created); viewAdmin();
    }, $('#bfs', box)); };
  });
  const deptForm = (x) => openModal(`<form id="df"><h2>${x ? 'Sửa phòng ban' : 'Thêm phòng ban'}</h2>
    <label class="field"><span>Mã phòng (viết tắt, không dấu)</span><input class="input" name="c" required value="${esc(x ? x.code : '')}" placeholder="KTAT"></label>
    <label class="field"><span>Tên phòng ban</span><input class="input" name="n" required value="${esc(x ? x.name : '')}" placeholder="Phòng Kỹ thuật – An toàn"></label>
    <div class="row"><button type="button" class="btn ghost" data-close>Hủy bỏ</button><span class="grow"></span><button class="btn primary" id="dfs">Lưu</button></div></form>`, (box) => {
    $('#df', box).onsubmit = (e) => { e.preventDefault(); const f = e.target; guard(async () => { await api('admin.deptSave', { id: x && x.id, code: f.c.value, name: f.n.value }); closeModal(); toast('Đã lưu'); viewAdmin(); }, $('#dfs', box)); };
  });
  if ($('#dadd')) $('#dadd').onclick = () => deptForm(null);
  $$('[data-de]').forEach((b) => (b.onclick = () => deptForm(d.depts.find((x) => x.id === +b.dataset.de))));
  if ($('#cfgf')) {
    let hol = [...(d.cfg.holidays || [])];
    const drawH = () => { $('#hl').innerHTML = hol.length ? hol.map((x) => `<button type="button" class="chip" data-hr="${x}" title="Bấm để xóa">${x.split('-').reverse().join('/')} ✕</button>`).join('') : '<span class="small muted">Chưa khai báo ngày nghỉ lễ.</span>'; $$('[data-hr]').forEach((b) => (b.onclick = () => { hol = hol.filter((x) => x !== b.dataset.hr); drawH(); })); };
    drawH();
    $('#hadd').onclick = () => { const v = $('#hd').value; if (v && !hol.includes(v)) { hol.push(v); hol.sort(); drawH(); } };
    $('#cfgf').onsubmit = (e) => { e.preventDefault(); const f = e.target; guard(async () => { await api('admin.settingsSave', { overload: +f.o.value, idle: +f.i.value, holidays: hol }); toast('Đã lưu cài đặt'); }); };
  }
  if ($('#tgset')) $('#tgset').onclick = (e) => guard(async () => { const r = await api('admin.tgSetup'); toast(`Đã cài webhook cho @${r.bot}`); if (!r.matches) toast('Lưu ý: TG_BOT_USERNAME trên Worker khác tên bot thật (@' + r.bot + ')', true); }, e.target);
  if ($('#tgtest')) $('#tgtest').onclick = (e) => guard(async () => { const r = await api('admin.tgTest'); toast(r.ok ? 'Đã gửi, kiểm tra Telegram' : 'Gửi không thành công', !r.ok); }, e.target);
  $$('[data-cron]').forEach((b) => (b.onclick = () => guard(async () => { await api('admin.runCron', { which: b.dataset.cron }); toast('Đã chạy'); }, b)));
}

/* ---------------- khởi động ---------------- */
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
window.addEventListener('hashchange', () => { const m = location.hash.match(/t=(\d+)/); if (m && S.me) { history.replaceState(null, '', location.pathname); openTask(+m[1]); } });
if (API_URL.includes('YOUR-SUBDOMAIN')) document.getElementById('root').innerHTML = '<div class="auth"><div class="box"><h1>Chưa cấu hình</h1><p>Mở index.html, sửa dòng <b>API_URL</b> thành địa chỉ Worker rồi tải lại trang.</p></div></div>';
else if (S.tok) boot(); else renderLogin();
</script>
</body>
</html>
